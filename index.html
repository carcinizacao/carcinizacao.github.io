<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><!-- [etapa-33] -->
<title>Carcinização — evolua até virar caranguejo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* [etapa-13] TOKENS — única fonte de cor, raio, espaçamento, sombra, tipografia e duração. Nenhuma cor literal fora daqui. */
  :root{
   /* cores (geradas a partir da paleta; variações "-aNN" = mesma cor com NN% de opacidade) */
   --bg-0:#04121f;
   --bg-1-a72:rgba(3,20,36,0.72);
   --bg-deep-a93:rgba(1,8,16,0.93);
   --bg-hc-a97:rgba(0,4,10,0.97);
   --black-a25:rgba(0,0,0,0.25);
   --black-a40:rgba(0,0,0,0.4);
   --black-a78:rgba(0,0,0,0.78);
   --blue-2-a45:rgba(160,200,255,0.45);
   --blue-a70:rgba(90,169,255,0.7);
   --blue-soft:#a9c8ff;
   --card-c-1-a95:rgba(25,70,95,0.95);
   --card-c-2-a95:rgba(8,30,48,0.95);
   --card-dash-1-a95:rgba(40,55,110,0.95);
   --card-dash-2-a95:rgba(12,20,50,0.95);
   --card-e-1-a95:rgba(70,35,120,0.95);
   --card-e-2-a95:rgba(25,10,50,0.95);
   --card-f-1-a97:rgba(90,20,70,0.97);
   --card-f-2-a97:rgba(20,10,45,0.97);
   --card-l-1-a95:rgba(120,80,15,0.95);
   --card-l-2-a95:rgba(45,25,5,0.95);
   --card-r-1-a95:rgba(25,60,120,0.95);
   --card-r-2-a95:rgba(8,22,55,0.95);
   --coral:#ff6a3d;
   --coral-deep:#8a2412;
   --coral-glow-a45:rgba(255,90,54,0.45);
   --coral-hi:#ffb26b;
   --coral-shadow:#9b3015;
   --cyan:#7ff0e6;
   --cyan-2:#3fd0c4;
   --cyan-3:#2fb8ac;
   --cyan-a12:rgba(127,240,230,0.12);
   --cyan-a35:rgba(127,240,230,0.35);
   --cyan-a50:rgba(127,240,230,0.5);
   --cyan-hi:#a9fff5;
   --cyan-shadow:#127a72;
   --cyan-soft:#b9f5ee;
   --gold:#ffd166;
   --gold-a12:rgba(255,209,102,0.12);
   --gold-a16:rgba(255,209,102,0.16);
   --gold-a18:rgba(255,209,102,0.18);
   --gold-a25:rgba(255,209,102,0.25);
   --gold-a30:rgba(255,209,102,0.3);
   --gold-a45:rgba(255,209,102,0.45);
   --gold-a50:rgba(255,209,102,0.5);
   --gold-a60:rgba(255,209,102,0.6);
   --gold-shadow:#8a5a00;
   --green:#5df08a;
   --green-a12:rgba(93,240,138,0.12);
   --green-a50:rgba(93,240,138,0.5);
   --green-a8:rgba(93,240,138,0.08);
   --ink:#eafcff;
   --ink-2:#cfe7ee;
   --ink-3:#b9d3dc;
   --line-hc:#e8f6ff;
   --on-coral:#2a0d04;
   --on-cyan:#032a28;
   --on-green:#003322;
   --on-pearl:#3a2300;
   --on-violet:#1d0b45;
   --pearl:#ffe7b0;
   --pearl-2:#f2b84b;
   --pink:#ff6fd8;
   --rar-c:#9fe9e1;
   --rar-e:#cfb3ff;
   --rar-f:#ffb3ec;
   --rar-r:#8cc4ff;
   --red:#ff5d5d;
   --red-a14:rgba(255,93,93,0.14);
   --red-a18:rgba(255,93,93,0.18);
   --red-a40:rgba(255,93,93,0.4);
   --red-pale:#ffd0d0;
   --red-soft:#ff9b9b;
   --red-soft-2:#ff8a8a;
   --surface-2-a95:rgba(6,30,44,0.95);
   --surface-3:#123a52;
   --surface-4:#0b2a3e;
   --surface-a75:rgba(3,18,32,0.75);
   --surface-a80:rgba(3,18,32,0.8);
   --surface-hc:#03111c;
   --violet:#9b6bff;
   --violet-2-a25:rgba(179,136,255,0.25);
   --violet-2-a80:rgba(179,136,255,0.8);
   --violet-hi:#d9c2ff;
   --violet-shadow:#4b2a99;
   --white:#ffffff;
   --white-a10:rgba(255,255,255,0.1);
   --white-a12:rgba(255,255,255,0.12);
   --white-a14:rgba(255,255,255,0.14);
   --white-a15:rgba(255,255,255,0.15);
   --white-a16:rgba(255,255,255,0.16);
   --white-a18:rgba(255,255,255,0.18);
   --white-a20:rgba(255,255,255,0.2);
   --white-a22:rgba(255,255,255,0.22);
   --white-a25:rgba(255,255,255,0.25);
   --white-a30:rgba(255,255,255,0.3);
   --white-a35:rgba(255,255,255,0.35);
   --white-a5:rgba(255,255,255,0.05);
   --white-a50:rgba(255,255,255,0.5);
   --white-a6:rgba(255,255,255,0.06);
   --white-a8:rgba(255,255,255,0.08);
   /* cores usadas só pelo canvas (HUD) — lidas pelo objeto THEME */
   --orange:#ff9b5d;--pink-2:#ff5d8a;--lime:#a6ff4d;--violet-2:#b388ff;
   /* raios, espaços, sombras */
   --r-s:10px;--r-m:16px;--r-l:20px;--r-pill:999px;
   --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;
   --sh-1:0 6px 14px var(--black-a40);--sh-2:0 12px 24px var(--black-a40);
   /* tipografia: Baloo 2 só em títulos e números grandes; texto corrido e interface em fonte do sistema */
   --font-display:'Baloo 2',system-ui,sans-serif;--font-ui:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
   /* durações */
   --dur-fast:.12s;--dur-med:.2s;--dur-slow:.35s;
   /* estados */
   --st-available:var(--cyan);--st-selected:var(--gold);--st-done:var(--green);--st-critical:var(--red);--st-locked-opacity:.45;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-0);font-family:var(--font-ui);color:var(--ink);user-select:none;-webkit-user-select:none}
  /* [etapa-7] touch-action:none só no canvas (menus aceitam zoom do navegador); áreas seguras via variáveis */
  :root{--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px)}
  canvas{display:block;position:fixed;inset:0;touch-action:none}
  #ov button{touch-action:manipulation}
  #ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,var(--bg-1-a72),var(--bg-deep-a93));z-index:5;padding:max(20px,var(--sat)) max(20px,var(--sar)) max(20px,var(--sab)) max(20px,var(--sal));overflow:auto}
  #ov.hide{display:none}
  .panel{max-width:900px;width:100%;text-align:center;animation:pop .35s ease;margin:auto}
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  h1,h2,h3,.card .nm,.btn,.chain{font-family:var(--font-display)} /* [etapa-13] Baloo 2 só em títulos, nomes de carta e chamadas principais */
  h1{font-size:clamp(44px,9vw,92px);line-height:.9;font-weight:800;letter-spacing:1px;color:var(--coral);text-shadow:0 5px 0 var(--coral-deep),0 10px 30px var(--coral-glow-a45)}
  h2{font-size:clamp(30px,6vw,54px);font-weight:800;color:var(--gold);text-shadow:0 4px 0 var(--gold-shadow);margin-bottom:6px}
  h3{font-size:15px;letter-spacing:2px;text-transform:uppercase;opacity:.6;margin:14px 0 8px;font-weight:800}
  .sub{font-size:clamp(16px,2.6vw,21px);opacity:.85;margin:10px 0 18px}
  .chain{font-size:clamp(24px,5vw,38px);margin:6px 0 10px;letter-spacing:4px}
  .ctrl{display:inline-grid;grid-template-columns:auto auto;gap:2px 16px;text-align:left;background:var(--white-a6);border:1px solid var(--white-a12);padding:12px 18px;border-radius:16px;font-size:15px}
  .ctrl b{color:var(--cyan)}
  .btn{font-weight:800;font-size:22px;padding:12px 38px;border-radius:999px;border:none;cursor:pointer;color:var(--on-coral);background:linear-gradient(var(--coral-hi),var(--coral));box-shadow:0 6px 0 var(--coral-shadow),0 12px 24px var(--black-a40);transition:transform .1s}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--coral-shadow)}
  .btn.alt{background:linear-gradient(var(--cyan-hi),var(--cyan-2));color:var(--on-cyan);box-shadow:0 6px 0 var(--cyan-shadow),0 12px 24px var(--black-a40)}
  .btn.purple{background:linear-gradient(var(--violet-hi),var(--violet));color:var(--on-violet);box-shadow:0 6px 0 var(--violet-shadow),0 12px 24px var(--black-a40)}
  .cards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  .card{font-family:inherit;color:var(--ink);width:205px;min-height:250px;padding:18px 16px;border-radius:20px;border:2px solid var(--cyan-a35);background:linear-gradient(160deg,var(--card-c-1-a95),var(--card-c-2-a95));cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .12s,border-color .12s,box-shadow .12s,opacity .2s;box-shadow:0 10px 30px var(--black-a40)}
  .card:hover,.card:focus{transform:translateY(-6px) rotate(-1deg);border-color:var(--gold);box-shadow:0 16px 40px var(--gold-a25);outline:none}
  .card.dash{border-color:var(--blue-2-a45);background:linear-gradient(160deg,var(--card-dash-1-a95),var(--card-dash-2-a95))}
  .card .ic{font-size:56px;line-height:1.1;filter:drop-shadow(0 4px 6px var(--black-a40))}
  .card .nm{font-size:22px;font-weight:800;line-height:1.1}
  .card .lv{font-size:14px;color:var(--gold);font-weight:700}
  .card .tag{font-size:12px;letter-spacing:1px;font-weight:800;color:var(--blue-soft)}
  .card .ds{font-size:16px;line-height:1.25}
  .card .k{margin-top:auto;font-size:13px;opacity:.8} /* [etapa-15] contraste ≥ 4,5:1 */
  .pips{display:flex;gap:4px}
  .pips i{width:12px;height:12px;border-radius:50%;background:var(--white-a18);display:block}
  .pips i.on{background:var(--gold)}
  .pips i.nx{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
  .stats{display:inline-grid;grid-template-columns:auto auto;gap:4px 24px;font-size:19px;margin:10px 0 22px;text-align:left}
  .stats span:nth-child(odd){opacity:.7}
  .stats span:nth-child(even){font-weight:800;color:var(--gold)}
  .small{font-size:13px;opacity:.55;margin-top:18px}
  .evo{font-size:clamp(70px,14vw,130px);margin:10px 0;animation:evoIn .6s ease-out} /* [etapa-9] entrada única ≤ 600 ms */
  @keyframes evoIn{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
  @keyframes wob{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.12) rotate(4deg)}}
  .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .opt{font-family:inherit;color:var(--ink);cursor:pointer;border-radius:16px;padding:10px 16px;min-width:150px;border:2px solid var(--white-a14);background:var(--white-a5);text-align:left;transition:all .12s}
  .opt:hover{border-color:var(--gold-a60)}
  .opt.on{border-color:var(--gold);background:var(--gold-a12);box-shadow:0 0 20px var(--gold-a18)}
  .opt b{font-size:18px;display:block}
  .opt span{font-size:13px;opacity:.75;display:block;line-height:1.2}
  .opt em{font-style:normal;font-size:12px;color:var(--cyan);display:block;margin-top:2px}
  .map{display:flex;align-items:center;justify-content:center;gap:0;margin:16px 0 8px;flex-wrap:nowrap}
  .node{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--white-a6);border:3px solid var(--white-a15);position:relative;flex:none}
  .node.done{border-color:var(--green);background:var(--green-a12)}
  .node.done:after{content:'✓';position:absolute;right:-4px;bottom:-4px;background:var(--green);color:var(--on-green);border-radius:50%;width:22px;height:22px;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .node.next{border-color:var(--gold);box-shadow:0 0 24px var(--gold-a50);animation:wob 1.6s ease-in-out infinite}
  .link{width:34px;height:4px;background:var(--white-a15);flex:none}
  .link.done{background:var(--green)}
  /* [etapa-58] descidas: bifurcação no mapa e cartões de rota */
  .link.fork{height:auto;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:15px;line-height:1}
  .fk{opacity:.3;filter:grayscale(1)}
  .fk.on{opacity:1;filter:none}
  .rotas{display:flex;flex-direction:column;gap:12px;width:min(720px,100%);margin:12px auto 0}
  .rota{font:inherit;color:var(--ink);text-align:left;display:flex;align-items:stretch;gap:14px;padding:10px 12px 10px 10px;border-radius:14px;border:2px solid var(--white-a15);border-left:6px solid var(--white-a15);background:linear-gradient(90deg,rgba(4,18,30,.92),rgba(8,30,46,.88));cursor:pointer;box-shadow:0 8px 22px var(--black-a40);transition:transform .14s,border-color .14s,box-shadow .14s}
  .rota:hover,.rota:focus{transform:translateX(6px);border-color:var(--gold);box-shadow:0 8px 26px var(--gold-a25);outline:none}
  .rota:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  .rt-win{position:relative;flex:none;width:84px;min-height:118px;border-radius:10px;overflow:hidden;background:linear-gradient(180deg,var(--b0),var(--b1))}
  .rt-win:after{content:'';position:absolute;inset:0;background:rgba(0,8,16,var(--dk))}
  .rt-win svg{position:absolute;inset:0;width:100%;height:100%;z-index:1}
  .rt-win path{fill:none;stroke:rgba(255,255,255,.75);stroke-width:3;stroke-linecap:round;stroke-dasharray:2 7;animation:rtdash 1.6s linear infinite}
  @keyframes rtdash{to{stroke-dashoffset:-18}}
  .rt-a,.rt-b{position:absolute;left:50%;transform:translateX(-50%);z-index:2;display:flex;align-items:center;justify-content:center;border-radius:50%;line-height:1}
  .rt-a{top:4px;font-size:16px;width:26px;height:26px;background:rgba(0,0,0,.35);opacity:.8}
  .rt-b{bottom:4px;font-size:24px;width:36px;height:36px;background:rgba(0,0,0,.45);border:2px solid var(--gold)}
  .rt-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;justify-content:center}
  .rt-k{font-size:12px;letter-spacing:2px;font-weight:800;color:var(--blue-soft)}
  .rt-k b{letter-spacing:0;opacity:.75;margin-left:4px}
  .rt-nm{font-family:var(--font-display);font-size:22px;font-weight:800;line-height:1.1;color:var(--gold)}
  .rt-c{font-size:15px;line-height:1.3}
  .rt-pf{font-size:14px;line-height:1.3;opacity:.9;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .rt-g{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
  .rt-g i{width:5px;background:var(--white-a15);border-radius:1px}
  .rt-g i:nth-child(1){height:6px}.rt-g i:nth-child(2){height:10px}.rt-g i:nth-child(3){height:14px}
  .rt-g i.on{background:var(--gold)}
  .rt-pfd{flex-basis:100%;opacity:.85}
  .rt-rw{flex:none;width:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:8px;border:2px dashed var(--gold-a50);border-radius:12px;background:var(--gold-a12)}
  .rt-rk{font-size:10px;letter-spacing:1.5px;font-weight:800;opacity:.8}
  .rt-ri{font-size:28px;line-height:1.1}
  .rt-rw b{font-size:15px;color:var(--gold);line-height:1.15}
  .rt-rd{font-size:12.5px;line-height:1.25;opacity:.9}
  @media (max-width:600px){.rota{flex-wrap:wrap;gap:10px}.rt-win{width:64px;min-height:96px}.rt-main{flex-basis:calc(100% - 80px)}.rt-nm{font-size:19px}.rt-rw{width:100%;flex-direction:row;flex-wrap:wrap;justify-content:flex-start;text-align:left;gap:4px 8px;padding:6px 10px}.rt-rk{width:100%}.rt-ri{font-size:22px}.rt-rd{flex-basis:100%}}
  body.reduce-motion .rt-win path{animation:none}body.reduce-motion .rota:hover,body.reduce-motion .rota:focus{transform:none}
  body.hc .rota{border-color:var(--white)}body.hc .rt-c,body.hc .rt-pf,body.hc .rt-rd{opacity:1}
  @media (max-width:560px){.link.fork{font-size:11px;width:auto;margin:0 5px}}
  .info{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px auto 18px;max-width:760px;text-align:left}
  .info div{background:var(--white-a5);border:1px solid var(--white-a10);border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.3}
  .info b{color:var(--gold);font-size:15px}
  .card.r-R{border-color:var(--blue-a70);background:linear-gradient(160deg,var(--card-r-1-a95),var(--card-r-2-a95))}
  .card.r-E{border-color:var(--violet-2-a80);background:linear-gradient(160deg,var(--card-e-1-a95),var(--card-e-2-a95));box-shadow:0 0 24px var(--violet-2-a25)}
  .card.r-L{border-color:var(--gold);background:linear-gradient(160deg,var(--card-l-1-a95),var(--card-l-2-a95));animation:glow 1.4s ease-in-out infinite}
  .card.r-F{border:2px solid transparent;background:linear-gradient(160deg,var(--card-f-1-a97),var(--card-f-2-a97)) padding-box,linear-gradient(120deg,var(--pink),var(--gold),var(--cyan)) border-box;animation:glow 1s ease-in-out infinite}
  @keyframes glow{0%,100%{box-shadow:0 0 14px var(--gold-a30)}50%{box-shadow:0 0 34px var(--gold-a60)}}
  .rar{font-size:12px;letter-spacing:2px;font-weight:800;padding:1px 10px;border-radius:999px;background:var(--black-a40)} /* [etapa-15] fundo escuro: rótulo ≥ 4,5:1 em todas as raridades */
  .r-C .rar{color:var(--rar-c)}.r-R .rar{color:var(--rar-r)}.r-E .rar{color:var(--rar-e)}.r-L .rar{color:var(--gold)}.r-F .rar{color:var(--rar-f)}
  .card.locked{opacity:.45;cursor:not-allowed;filter:grayscale(.6)}
  .card.ban{border-color:var(--red)!important;box-shadow:0 0 20px var(--red-a40)!important}
  .tools{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
  .tool{font-family:inherit;font-weight:800;font-size:15px;min-height:44px;/* [etapa-3] alvo de toque */padding:8px 18px;border-radius:999px;border:2px solid var(--white-a20);background:var(--white-a6);color:var(--ink);cursor:pointer}
  .tool:disabled{opacity:.35;cursor:not-allowed}
  .tool.on{border-color:var(--red);background:var(--red-a18)}
  .pearl{color:var(--pearl);font-weight:800}
  .shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;text-align:left;margin:10px 0 16px}
  .item{background:var(--white-a5);border:1px solid var(--white-a12);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center}
  .item .ic{font-size:30px;flex:none;width:40px;text-align:center}
  .item .tx{flex:1;font-size:13px;line-height:1.25;opacity:.9}
  .item .tx b{font-size:15px;display:block;opacity:1}
  .item button{font-family:inherit;font-weight:800;font-size:13px;padding:6px 10px;border-radius:999px;border:none;cursor:pointer;background:linear-gradient(var(--pearl),var(--pearl-2));color:var(--on-pearl);flex:none}
  .item button:disabled{background:var(--white-a12);color:var(--white-a50);cursor:not-allowed}
  .item.got{border-color:var(--green-a50);background:var(--green-a8)}
  .item.off{opacity:.55}
  /* [etapa-63] Laboratório: camadas da Profundidade */
  .labinf{font-size:16px;color:var(--ink)}

function snd(f,d=.08,type='square',v=.04,slide=0,cat='sfx'){

 {"data":"2026-11-24","titulo":"A muda que refaz seus passos","html":"<ul><li><b>A Muda Chamariz ganhou um eco.</b> Enquanto ela está num espaço de especial, a carapaça lembra os seus últimos 6 segundos: por onde você nadou e onde golpeou.</li><li>Ao usar a Muda, a casca aparece onde você estava 6 s atrás e <b>refaz o seu caminho e os seus golpes</b>, por trás de quem vinha te seguindo. Ela continua atraindo os inimigos, como antes.</li><li>Quanto mais você se moveu, mais forte o golpe do eco (até 60% do seu). Parado, o eco não fere.</li></ul>"},
 {"data":"2026-11-24","titulo":"Disputa","html":"<ul><li><b>Evento novo:</b> ⚔️ <b>Disputa</b>. Dois predadores grandes brigam por uma carcaça, do Recife em diante. Uma seta aponta para a briga.</li><li>Os dois se ferem. Quem perde some sem deixar DNA, e o vencedor sai ferido e <b>alimentado</b> (vale mais DNA).</li><li>A escolha é sua: <b>espere</b> e derrote o vencedor enfraquecido, ou <b>entre na briga</b> cedo. Se você ferir um dos dois, eles param de brigar e vêm atrás de você.</li></ul>"},
 {"data":"2026-11-24","titulo":"O mar come o mar","html":"<ul><li><b>As criaturas agora caçam umas às outras.</b> Enguias, polvos, tubarões, peixes-lanterna e caranguejos rivais que não estão atrás de você procuram presas por perto: peixinhos, plâncton, ermitões, cavalos-marinhos, baiacus e até enguias.</li><li>Dá para ver quando alguém <b>não</b> está atrás de você: o caçador mostra uma linha tracejada até a presa e dentes à frente. A presa foge.</li><li>Quem comeu fica <b>alimentado</b> por um tempo: maior, mais lento, e vale mais DNA se você o derrotar. Alimentado, não caça.</li><li>Se você atacar um caçador, ele larga a caça e vem atrás de você. Presa comida por outra criatura não deixa DNA.</li></ul>"},
 {"data":"2026-11-24","titulo":"Você é o que come","html":"<ul><li><b>Caçar uma espécie dá a você um pouco dela.</b> Pegue 5 presas da mesma espécie nadando (engolindo ou abatendo com golpe ou dash) e você <b>assimila</b> essa espécie. O ícone aparece junto de você, com o tempo que falta, e embaixo fica o medidor da próxima.</li><li>🍃 Plâncton: mais DNA · 🦠 Ameba: mais armadura · 🐟 Peixinho: mais velocidade e dash · 🎐 Água-viva: quem encosta em você é envenenado · 🌀 Cavalo-marinho: mais alcance · 💦 Cuspidor: mais ritmo de ataque. Duram 20 s; continuar caçando renova, e a cada 5 presas o efeito sobe de nível (até 3).</li><li>🐡 Baiacu: empurra quem encosta · ⚡ Enguia: descarga elétrica a cada 3 s · 🐚 Ermitão: bloqueia o próximo golpe. Duram 12 s e não renovam.</li><li>Uma assimilação por vez: a próxima só troca a atual quando o medidor dela completa. Parado, nada conta. A pausa mostra a dieta, e o Códex registra cada espécie assimilada.</li></ul>"},
 {"data":"2026-11-24","titulo":"O chefe que te observou","html":"<ul><li><b>O Caranguejo Ancestral agora estuda você.</b> Se a maior parte do seu dano na campanha veio de fontes automáticas (bolhas, espinhos, cardume, anêmonas, raio…), ele chega adaptado a elas. A faixa avisa: \"Este chefe te observou por muito tempo.\"</li><li>💧 <b>Muco:</b> suas bolhas e projéteis batem nele e voltam. Em troca, ele demora para virar.</li><li>🦑 <b>Tentáculos Longos:</b> chicoteia de longe e não encosta em você. A chicotada é lenta, e ele tem um lado cego atrás.</li><li>🦈 <b>Predador de Cardume:</b> mira seus aliados primeiro e come o cardume e as anêmonas. Depois de comer, fica aberto por um tempo.</li><li>❄️ <b>Sangue Frio:</b> imune a veneno e efeitos, e raio e ampolas fazem metade do dano. Em troca, é mais lento.</li><li>Quem luta com golpes e dash quase nunca vê isso: ele chega dizendo que \"não soube o que esperar de você\".</li><li><b>No Infinito,</b> de vez em quando um chefe também te observa (lendo o dano desde o chefe anterior). Vencê-lo oferece a carta <b>Engolir a adaptação</b>, que ocupa uma escolha e dá a você um pedaço da adaptação dele.</li><li>4 conquistas novas, uma por adaptação vencida, e o Códex do Ancestral guarda as que você já viu.</li></ul>"},
 {"data":"2026-11-24","titulo":"Prepare-se para o chefe","html":"<ul><li><b>O que você faz antes do chefe muda a luta.</b> Nos biomas de ritmo Normal, o chefe tem uma preparação; nos de ritmo Agitado, o mini-chefe também. Um aviso no começo da onda diz o que fazer, e a faixa de entrada do chefe diz o resultado.</li><li>🕳️ <b>Ninhos:</b> alguns chefes chegam com dois ninhos das crias deles espalhados pelo bioma. Destrua os dois e o chefe não invoca (a Ameba-Mãe invoca só uma filha).</li><li>🐟 <b>Presa do predador:</b> o Baiacu Colossal, a Moreia Anciã e o Tubarão-Martelo caçam uma espécie do bioma. Cace essa espécie até ela rarear e o chefe chega <b>faminto</b>, com a fúria mais fraca. Se ninguém caçar, ele chega <b>bem alimentado</b> e se enfurece mais cedo.</li><li>🪨 <b>Território:</b> derrote o Alfa do bioma e a Lagosta Blindada perde a toca (não se enterra), e as batidas do Caranguejo-Sentinela avisam mais cedo.</li><li>A pausa mostra como está a preparação, e o Códex de cada chefe guarda a dica.</li></ul>"},
 {"data":"2026-11-24","titulo":"Infinito de horas","html":"<ul><li><b>O Infinito não tem mais parede.</b> As correntes continuam ficando mais fortes o tempo todo, mas num ritmo que dá para acompanhar. Antes, a força dos inimigos disparava perto dos 30 minutos. Agora a partida pode durar horas, e o desafio cresce junto.</li><li><b>A dificuldade fica à vista:</b> o HUD do Infinito mostra <b>∞ Correntes ×N</b> (quanto os inimigos estão mais fortes), e a faixa a cada 5 minutos também diz o valor.</li><li><b>Cartas que não acabam.</b> Com todas as mutações e fusões feitas, a escolha de nível passa a oferecer <b>cartas contínuas</b>: dano, vida, ritmo de ataque, alcance, velocidade e regeneração. Elas não têm limite, e cada nível soma um pouco menos que o anterior. Cada escolha cura 25% da vida, e dá para banir e sortear de novo. Elas substituem o Banquete.</li><li>No Infinito, os níveis continuam chegando depois do 40, e as criaturas rendem mais DNA com o tempo. A <b>Ascensão</b> para em ★10; daí em diante, quem cresce são as cartas contínuas que você escolhe.</li><li>Os <b>chefes do Infinito</b> acompanham a força das correntes e rendem menos DNA.</li><li><b>Continuar no Infinito</b> depois de zerar segue as correntes de onde a campanha parou. Como na Fossa as criaturas valem mais, lá elas rendem um pouco menos DNA.</li><li>O dano mínimo dos golpes no Infinito ficou menor.</li><li>Nova melhoria de Profundidade no Laboratório: 📜 <b>Linhagem Antiga</b>, que começa o Infinito com níveis de cartas contínuas.</li><li>Os recordes do Infinito continuam valendo, mas foram feitos com a curva antiga.</li></ul>"},
 {"data":"2026-11-24","titulo":"Laboratório para ir mais longe","html":"<ul><li><b>O Laboratório ganhou duas seções novas.</b></li><li>📚 <b>Saber</b>, que vale em todos os modos:<ul><li>🗺️ <b>Cartografia:</b> 3 descidas para escolher entre os biomas, em vez de 2.</li><li>👃 <b>Faro:</b> o Território do Alfa aparece no mapa assim que você entra no bioma.</li></ul></li><li>♾️ <b>Profundidade</b>, que vale só no Infinito. Ela é dividida em <b>camadas</b> que abrem quando o seu recorde no Infinito chega a 10, 20, 30, 45 e 60 minutos, em qualquer dificuldade. Ir mais longe abre o laboratório, e o laboratório leva mais longe.<ul><li>🌊 <b>Adaptação à Pressão:</b> as correntes do Infinito crescem mais devagar.</li><li>🫀 <b>Metabolismo Abissal:</b> mais DNA depois dos 20 minutos.</li><li>🫧 <b>Muda de Emergência:</b> uma vez por partida, ao morrer, você volta com parte da vida.</li></ul></li><li>O topo do Laboratório mostra o seu recorde no Infinito e a próxima camada. Na derrota no Infinito, aparece a camada que você acabou de abrir e a melhoria mais barata ao seu alcance. No menu, o modo Infinito mostra a sua camada.</li><li>Partidas longas no Infinito rendem mais pérolas: <b>+2 por minuto depois dos 10 minutos</b>.</li><li>Quem já tinha um recorde no Infinito começa com as camadas que ele já alcançou. Os números da Profundidade ainda podem mudar na próxima atualização, que mexe na curva do Infinito.</li></ul>"},
 {"data":"2026-11-24","titulo":"Tubarões que dá para ler","html":"<ul><li><b>Os tubarões avisam antes da investida.</b> O aviso dura mais (1 segundo) e, no fim dele, o tubarão <b>trava a mira</b>: as bordas brancas da faixa deixam de ser tracejadas e ficam contínuas. A partir daí ele vai reto, então dá tempo de sair de lado. Antes ele corrigia a mira até o último instante.</li><li><b>O esbarrão do tubarão dói menos.</b> O golpe perigoso é a investida; encostar nele fora dela tira metade do que tirava.</li><li>Vale na Campanha e no Infinito. O tubarão continua sendo o predador do abismo: quem fica parado na linha da investida ainda leva o golpe cheio.</li></ul>"},
 {"data":"2026-11-24","titulo":"Caça que muda o bioma","html":"<ul><li><b>O bioma lembra do que você caça.</b> Caçar muito uma mesma espécie faz ela <b>rarear</b>: aparece menos por um tempo, e as outras ficam mais comuns. Uma faixa avisa, por exemplo \"Os peixinhos rarearam.\". Ela nunca some, e volta a aparecer como antes uns 30 segundos depois que você para de caçá-la. Cada bioma começa do zero.</li><li>O <b>Códex</b> conta quantas espécies você já fez rarear e marca cada uma delas.</li><li><b>Eventos que combinam com a sua build.</b> Quando você tem a build certa, o evento ganha um bônus, anunciado na faixa dele:<ul><li>💨 <b>Corrente:</b> com mutações de dash, o dash a favor da corrente vai 30% mais longe.</li><li>🌼 <b>Floração:</b> com Gula, Leviatã Voraz ou Ostra Perlífera, o Frenesi dura o dobro.</li><li>🐡 <b>Migração:</b> com Cardume Aliado, 2 peixinhos a mais nadam com você enquanto o cardume passa.</li><li>♨️ <b>Erupção Termal:</b> com Quimiossíntese ou Banquete Abissal, as fendas ferem os inimigos também.</li></ul></li></ul>"},
 {"data":"2026-11-23","titulo":"Território do Alfa","html":"<ul><li><b>Um marco novo: 🪨 Território.</b> Nos biomas de ritmo Normal ou Agitado, um dos marcos pode ser um território: pedras riscadas por garras, com bolhas subindo entre elas. Ali vive um <b>Alfa</b>, uma criatura maior com <b>dois</b> afixos de elite, que nunca sai do círculo das pedras dele.</li><li><b>O Alfa muda o entorno.</b> Perto das pedras dele, as presas que ele caça não aparecem, e as que chegam perto fogem. Cada bioma tem o seu: na Poça, uma Ameba que espanta o plâncton; no Recife, um Baiacu que espanta peixinhos e ermitões; e assim por diante.</li><li><b>Vencer o Alfa vale a pena:</b> uma escolha de parte a mais (a partir do Crustáceo Jovem), ou muito DNA antes disso. Sem ele, as presas voltam às pedras, e uns 20 segundos depois um predador aparece para disputar o lugar.</li><li>A condição <b>Disputa de Território</b>, na Floresta, deixa os territórios mais comuns. A pausa mostra quando o Alfa já foi derrotado.</li></ul>"},
 {"data":"2026-11-23","titulo":"Marcos do bioma","html":"<ul><li><b>Lugares que valem um desvio.</b> Cada bioma agora tem marcos espalhados pelo mapa: <b>um</b> no ritmo Calmo, <b>dois</b> no Normal e <b>três</b> no Agitado. Eles ficam lá até serem usados ou até o chefe do bioma cair.<ul><li><b>Recursos</b>, que servem várias vezes até se esgotar: 🦴 <b>Carcaça</b> (cura e DNA, mas atrai predadores), 🍃 <b>Leito de Plâncton</b> (plâncton sem parar, Frenesi fácil) e ♨️ <b>Fonte Termal</b> (nódulos de DNA; cura quem tem Quimiossíntese e superaquece quem não tem).</li><li><b>Fenômenos</b>, de uso único: fique <b>1 segundo</b> dentro para ativar. O efeito vale só ali: 🌸 <b>Desova de Corais</b> (espinhos e menos dano por 12 s), 🥚 <b>Bolsão de Muda</b> (cura e bloqueia 3 golpes) e 🌨️ <b>Nuvem de Neve Marinha</b> (inimigos lentos e o DNA vem até você por 10 s).</li></ul></li><li><b>Descoberta:</b> cada marco se anuncia de longe, com cardume rodando, bolhas subindo ou flocos caindo. Você o encontra ao vê-lo ou ao farejá-lo. <b>Antenas Sensíveis</b>, <b>Antenas Longas</b> e <b>Quimiorrecepção</b> aumentam o faro; o escuro diminui. A seta na borda da tela só aparece depois que você encontra o marco. Se passar 20 s sem achar nenhum, uma <b>seta pálida</b> aponta a região, e fica mais precisa conforme você se aproxima.</li><li>A <b>pausa</b> mostra quantos marcos o bioma tem e quais você já encontrou. A condição da descida pode favorecer um marco: na Fossa Ativa, por exemplo, a Fonte Termal aparece mais.</li></ul>"},
 {"data":"2026-11-23","titulo":"Descidas: escolha o caminho","html":"<ul><li><b>Você escolhe por onde descer.</b> Ao concluir um bioma, aparecem <b>duas descidas</b> para o próximo. O bioma é o mesmo, mas a situação muda: cada caminho chega com uma condição diferente e uma recompensa diferente.<ul><li>Recompensas possíveis: 🧩 uma parte a mais do chefe, ⚪ um tesouro de pérolas, 🧬 presas que rendem mais DNA ou 💎 uma escolha extra só com mutações raras.</li><li>Cada descida aparece como uma trilha com o caminho, o ritmo e a recompensa. Escolha tocando nela, com as teclas <b>1</b> e <b>2</b> ou com o controle.</li></ul></li><li><b>Ritmo do bioma:</b> cada bioma agora pode ser <b>Calmo</b>, <b>Normal</b> ou <b>Agitado</b>. Nos biomas agitados os eventos vêm bem mais seguidos. O ritmo aparece na trilha da descida, na faixa de entrada do bioma e na pausa. Nunca vêm dois agitados seguidos.</li><li><b>Mapa:</b> o mapa da campanha mostra o caminho que você escolheu em cada descida. O fim da partida lista as descidas.</li><li><b>Desafio diário:</b> todo mundo recebe as mesmas descidas no mesmo dia.</li></ul>"},
 {"data":"2026-11-23","titulo":"Condições Ecológicas","html":"<ul><li><b>Cada bioma pode estar diferente.</b> Ao chegar num bioma da campanha, ele vem com uma <b>condição</b> que muda quem aparece, os eventos ou uma regra pequena. Uma faixa anuncia a condição logo depois do nome do bioma.<ul><li>Exemplos: 🏝️ <b>Maré Baixa</b> na Poça (muitos ermitões, que valem o dobro de DNA), 🤍 <b>Branqueamento</b> no Recife (pouco tiro, muito contato), 🌑 <b>Inverno Escuro</b> na Floresta (bem mais escuro e cheio de polvos), 🌋 <b>Fossa Ativa</b> (fumarolas e erupções o tempo todo).</li><li>Também há estirpes: 🛡️ <b>Estirpe Blindada</b> e 🧲 <b>Estirpe Voraz</b> decidem que tipo de elite aparece no bioma.</li></ul></li><li><b>Onde ver:</b> no topo da tela, ao lado do evento, e na pausa.</li><li><b>Códex:</b> aba nova <b>🌡️ Condições</b>, com as que você já encontrou e o tipo de build que cada uma favorece.</li><li><b>Primeiras partidas:</b> a Poça de Maré só ganha condição depois que você vence a Ameba-Mãe pela primeira vez.</li></ul>"},
 {"data":"2026-11-23","titulo":"Novidades no menu","html":"<ul><li><b>📜 Novidades:</b> um botão novo no menu mostra tudo o que entrou no jogo, por data. Um ponto avisa quando há algo que você ainda não viu.</li><li><b>Versão do jogo:</b> aparece no canto do menu, com a data da última atualização.</li></ul>"},
 {"data":"2026-11-23","titulo":"Especiais: dois botões novos","html":"<ul><li><b>Especiais: dois botões novos.</b> Ao virar Crustáceo Jovem você ganha um espaço de Especial, e ao virar Caranguejo, o segundo. Algumas mutações agora são poderes que você usa na hora certa:<ul><li>🏰 <b>Anel de Espinhos</b> (Fortaleza Espinhosa): dispara um anel de espinhos quando você quiser.</li><li>🌫️ <b>Nuvem de Tinta</b> (Tinta Camuflante): uma nuvem que apaga os tiros inimigos e te deixa invisível por 2 segundos.</li><li>🎭 <b>Muda Chamariz:</b> joga a casca-isca onde você mira.</li><li>🏵️ <b>Maré de Corais</b> (Carapaça Coralina): os corais brotam na hora, sem precisar ficar parado.</li><li>🔊 <b>Estalo Sônico</b> (Pulso Sônico): é passivo. Atordoa quem chega perto de tempos em tempos, sozinho.</li></ul></li><li><b>Botões:</b> Q e E no teclado (dá para trocar em Opções → Teclas), LB e RB no controle e dois botões novos perto do ataque no celular. O anel em volta do botão mostra a recarga.</li><li><b>Controle:</b> o dash agora fica no B ou no LT (o RB virou o segundo especial).</li><li><b>Espaços cheios:</b> a carta avisa qual especial vai sair, e com dois espaços cheios você escolhe qual trocar.</li><li><b>No celular em pé</b>, o menu sugere girar o aparelho.</li></ul>"},
 {"data":"2026-11-23","titulo":"Tela mais limpa no fundo do mar","html":"<ul><li><b>Tela mais limpa no fim da partida:</b> na Zona Abissal e na Fossa vêm menos inimigos de cada vez, mas cada um aguenta mais e dá mais experiência.</li><li><b>Perigo em destaque:</b> os tiros dos inimigos ficaram mais fortes na cor e com contorno escuro. As suas bolhas, o seu cardume e as suas anêmonas ficaram mais suaves, para você ver na hora o que precisa desviar.</li><li><b>Fundo mais escuro</b> na Zona Abissal e na Fossa.</li><li><b>Opção nova, \"Efeitos aliados\"</b> (Opções → Conforto visual): Completo, Reduzido ou Mínimo. Desenha menos efeitos seus na tela, sem mudar o dano. No celular, começa em Reduzido.</li></ul>"},
 {"data":"2026-11-23","titulo":"O fundo do mar ficou mais perigoso","html":"<ul><li><b>O fundo do mar ficou mais perigoso:</b> do 3º bioma em diante, os inimigos e os chefes batem bem mais forte. Ficar parado com uma build defensiva não basta mais.</li><li><b>Começo mais justo:</b> a Ameba-Mãe bate menos, e o 1º bioma dá um pouco mais de folga.</li><li><b>Elite novo, Necrótico</b> (anel roxo pontilhado): o golpe dele corta sua cura pela metade por 4 segundos.</li><li><b>Parado demais:</b> depois de 6 segundos no mesmo lugar, toda cura cai pela metade até você se mexer.</li><li><b>Regeneração:</b> rende menos logo depois de você levar dano.</li><li><b>Jato de Bolhas:</b> cada bolha causa um pouco menos de dano.</li></ul>"},
 {"data":"2026-11-23","titulo":"Ficar parado rende menos","html":"<ul><li><b>Digestão Voraz:</b> cura bem mais com os seus golpes e o dash do que com o dano automático (espinhos, bolhas, aliados).</li><li><b>Carapaça Coralina:</b> os corais duram até 4 segundos. Depois caem, e você precisa andar um pouco para eles crescerem de novo.</li><li><b>Jato de Bolhas:</b> se você fica parado, as bolhas só miram nos inimigos bem perto.</li></ul>"},
 {"data":"2026-11-23","titulo":"Modo Infinito como recompensa","html":"<ul><li><b>Modo Infinito:</b> agora abre quando você zera a campanha pela primeira vez. Antes disso, ele aparece no menu com um cadeado. Se você já jogou o Infinito antes, ele continua liberado.</li><li><b>Desafio diário:</b> continua liberado desde o começo.</li></ul>"},
 {"data":"2026-11-22","titulo":"Expansão do Fundo do Mar","html":"<p>Tudo o que entrou no jogo até 22/11/2026. O mar ficou bem mais cheio. Cada mutação agora aparece no seu corpo, e há muita coisa nova para encontrar no caminho até virar caranguejo.</p><h4>Seu corpo conta a história</h4><ul><li><b>Toda mutação deixa uma marca visível.</b> Listras de fúria, ferrão pingando, pupila em fenda, bolhas saindo pela cauda, brasa da Muda Ressurgente…</li><li><b>As fusões trocam a marca das duas mutações</b> por um visual próprio.</li><li><b>Ilustrações e ícones novos:</b> cada parte de animal tem ilustração própria nas cartas, e os ícones repetidos foram trocados.</li></ul><h4>16 mutações novas</h4><ul><li><b>5 Comuns:</b><ul><li><b>Cnidócitos:</b> bate mais forte em quem está envenenado ou na tinta.</li><li><b>Neve Marinha:</b> cada abate cura um pouco.</li><li><b>Embalo:</b> fica mais rápido depois do dash.</li><li><b>Quimiorrecepção:</b> fareja elites fora da tela.</li><li><b>Calcificação:</b> menos dano de projéteis e zonas.</li></ul></li><li><b>4 Raras:</b><ul><li><b>Pressão Abissal:</b> críticos explodem.</li><li><b>Camarão-Limpador:</b> um amiguinho que tira o veneno.</li><li><b>Tinta Camuflante:</b> some no dash.</li><li><b>Muda Chamariz:</b> deixa a casca velha como isca.</li></ul></li><li><b>2 Épicas:</b><ul><li><b>Ostra Perlífera:</b> engolir vira munição.</li><li><b>Anêmona Simbionte:</b> planta torretas urticantes.</li></ul></li><li><b>1 Lendária:</b><ul><li><b>👑 Carcinização Total:</b> finalmente, um caranguejo de verdade. Todas as suas partes sobem um nível e seus golpes empurram muito mais.</li></ul></li><li><b>4 fusões:</b> Toque de Medusa, Fantasma do Recife, Recife Vivo e Farol Abissal.</li></ul><h4>8 partes de animais novas</h4><ul><li><b>Arma:</b> Pinças-Pompom (envenenam) e Pinça-Martelo (quebra cascas).</li><li><b>Corpo:</b> Carapaça Decoradora (camuflagem) e Esponja Viva (absorve tiros e devolve).</li><li><b>Locomoção:</b> Remos de Siri (dash longo que corta tiros) e Tentáculos de Polvo (puxa e atordoa).</li><li><b>Cabeça:</b> Olhos-Fantasma (avisam ataques fora da tela) e Estridulação (um chiado que atordoa).</li></ul><p><b>Conjuntos:</b> junte partes do mesmo animal para ganhar bônus e um título. Por exemplo, \"Caranguejo Lagostino\" deixa um rastro no dash.</p><h4>O mar reage</h4><ul><li><b>Elites novos:</b><ul><li>Regenerador: se cura;</li><li>Magnético: rouba seu DNA e devolve ao morrer;</li><li>Escudeiro: protege os vizinhos.</li></ul></li><li><b>Eventos novos:</b><ul><li>Floração de Plâncton: comida e DNA extra;</li><li>Migração: um cardume atravessa a tela;</li><li>Erupção Termal: fendas que explodem.</li></ul></li><li><b>Criaturas novas:</b><ul><li>Ermitão: se esconde na concha;</li><li>Arraia: salta da areia;</li><li>Cavalo-marinho: atirador de longe;</li><li>Nudibrânquio: deixa um rastro venenoso.</li></ul></li><li><b>Ataques de chefe novos:</b><ul><li>Varredura: leque de espinhos;</li><li>Emergir: o chefe some e sai debaixo de você;</li><li>Vórtice: puxa você para perto.</li></ul></li><li><b>Avisos:</b> todo ataque novo avisa antes, tem dica na tela de derrota e funciona com reduzir movimento e com o modo daltônico.</li></ul><h4>Mais mutações, fusões e partes</h4><ul><li><b>6 mutações novas:</b><ul><li><b>🧲 Magnetismo:</b> puxa o DNA de mais longe.</li><li><b>💎 Mineralização:</b> mais armadura, e os inimigos te empurram menos.</li><li><b>⭕ Cavitação:</b> cada golpe estoura uma bolha que acerta em volta.</li><li><b>⚗️ Quimiossíntese:</b> você se cura perto das fendas termais.</li><li><b>🏵️ Coralino:</b> fique parado um instante e corais te protegem e espetam quem encosta.</li><li><b>🔊 Sônico:</b> o dash solta um estalo que atordoa.</li></ul></li><li><b>4 fusões novas:</b><ul><li><b>🏛️ Titã Litodídeo:</b> muita vida, ninguém te empurra e tiros doem metade.</li><li><b>🕳️ Supercavitação:</b> bolhas fortes que puxam os inimigos.</li><li><b>🍽️ Banquete Abissal:</b> abates soltam nuvens que curam e dão força.</li><li><b>⚡ Ampolas de Lorenzini:</b> choques automáticos em quem está mirando em você.</li></ul></li><li><b>6 partes novas:</b><ul><li><b>Do polvo:</b> Chicote, Manto de Camuflagem e Olhos de Lente.</li><li><b>Do ermitão:</b> Pinça Retrátil e Passo Escavador.</li><li><b>Do camarão-pistola:</b> Casca Translúcida.</li></ul></li><li><b>3 conjuntos novos:</b><ul><li><b>Kraken:</b> tinta no dash que anula tiros.</li><li><b>Senhor da Concha:</b> a concha solta lascas ao bloquear.</li><li><b>Supercavitador:</b> detonações que quebram armaduras.</li></ul></li></ul><h4>Frenesi Alimentar</h4><ul><li><b>Como ativa:</b> engula 3 presas em sequência rápida.</li><li><b>O que dá:</b> alguns segundos mais rápido e atraindo DNA de mais longe.</li><li><b>Música:</b> cada engolida toca a nota seguinte de uma escala.</li><li><b>Rastro:</b> você deixa bolhinhas douradas.</li></ul><h4>Eventos com lugar no mapa</h4><ul><li><b>🐋 Queda da Baleia:</b> uma carcaça afunda perto de você, com cura e DNA em volta. Predadores elite vêm atrás.</li><li><b>✨ Maré Bioluminescente:</b> tudo que nada deixa um rastro de luz, e inimigos sobre a luz apanham mais.</li><li><b>🧂 Lago de Salmoura:</b> atraia os inimigos para as poças, onde ficam lentos e corroem. O DNA que cai nelas vale o triplo.</li><li><b>♨️ Fumarola Negra:</b> uma chaminé vulcânica surge no fundo. Perto dela, você ataca 30% mais rápido e cada golpe solta uma onda de vapor. Fique tempo demais e o calor começa a queimar. Ela cospe nódulos que valem 4 orbes de DNA, e os inimigos na pluma se cozinham devagar. Com Quimiossíntese, o calor não machuca e a cura triplica.</li></ul><h4>Radiação Adaptativa</h4><p>Ao virar caranguejo, escolha a sua linhagem. Ela muda o seu corpo, o seu título e o seu jeito de lutar:</p><ul><li><b>🗿 Braquiúro Bentônico:</b> mais vida e armadura. Cada golpe faz o chão tremer, ferindo e atrasando quem está em volta.</li><li><b>🏄 Portunídeo Pelágico:</b> mais rápido e com uma carga de dash a mais. O dash deixa uma esteira que desvia tiros e acelera você.</li><li><b>⚔️ Quelípede Guerreiro:</b> golpes mais largos e mais críticos. Cada crítico racha a carapaça do alvo, que fica sem armadura e apanha mais por alguns segundos.</li></ul><h4>Para explorar e colecionar</h4><ul><li><b>📖 Códex:</b> tudo o que você já encontrou (criaturas, mutações e partes), cada um com uma curiosidade real sobre o fundo do mar.</li><li><b>8 conquistas novas:</b> 21 no total.</li><li><b>Laboratório:</b><ul><li><b>Herança:</b> comece a fase de partes com uma delas.</li><li><b>Mais Partes:</b> sorteie de novo a tela de partes.</li><li><b>🎨 Paletas de carapaça:</b> Siri-azul, Coral, Albino e Abissal (só visual).</li></ul></li></ul><h4>Desafio diário e modificadores</h4><ul><li><b>🎯 Desafio de hoje:</b> as mesmas cartas, partes e criaturas para todo mundo no mesmo dia, com recorde próprio.</li><li><b>Modificadores:</b> Só Pinças, Sem Dash, Maré Eterna, Casca de Vidro, Enxame e Elite em Dobro. Cada um dá pérolas extras, até o dobro do normal. Ficam numa seção recolhível do menu.</li></ul><h4>Chefes com mais presença</h4><ul><li><b>Chefes não derretem mais em segundos.</b> Por mais forte que esteja a sua build, um chefe agora dura cerca de 20 s (mini-chefes, cerca de 12 s), tempo para mostrar os ataques dele.</li><li><b>A fúria sempre acontece.</b> Na metade da vida, o chefe se enfurece e fica protegido por um instante. O anel branco tracejado e a palavra \"protegido\" avisam quando os golpes não entram.</li><li><b>Entrada em cena:</b> o chefe fica protegido nos primeiros 2 s, enquanto o nome dele aparece.</li><li><b>Bata na hora certa:</b> quando aparece \"recuperando…\", seus golpes fortes rendem mais.</li><li><b>Builds iniciantes não mudam:</b> se o seu dano ainda é baixo, a luta dura o mesmo de antes.</li></ul><h4>Criaturas mais fáceis de reconhecer</h4><ul><li><b>Cada criatura olha para onde vai.</b> A arraia salta na direção certa; ermitão, cavalo-marinho e nudibrânquio não \"viram\" mais de repente ao atacar.</li><li><b>Peixes sempre de barriga para baixo</b>, para qualquer lado que nadem. O cavalo-marinho nada sempre de pé.</li><li><b>Enguias e Moreia com corpo de verdade</b>, mesmo paradas.</li><li><b>Inimigos que nunca se confundem com você:</b> caranguejos rivais e a Lagosta Blindada agora têm corpo escuro com contorno claro (o seu crustáceo é claro com contorno escuro), seja qual for a sua paleta.</li><li><b>Chefes com cara própria:</b><ul><li><b>Moreia Anciã:</b> bocarra com dentes, que se escancara antes de atacar.</li><li><b>Caranguejo-Sentinela:</b> blindado, com as pinças erguidas como escudo.</li><li><b>Caranguejo Ancestral:</b> uma pinça colossal e a carapaça coberta de cracas, coral e cicatrizes.</li><li><b>Caranguejo rival:</b> espinhos nas laterais e uma pinça maior que a outra.</li></ul></li><li><b>Mais bichos com cara de verdade:</b><ul><li><b>Arraia:</b> disco largo que ondula e cauda com ferrão. Enterrada, um olho fica de fora.</li><li><b>Enguia:</b> corpo liso com faixa no dorso e cabeça pontuda, que escancara a boca antes do bote.</li><li><b>Cuspidor:</b> peixe comprido de queixo para cima. A bochecha incha quando ele mira.</li><li><b>Água-viva Rainha:</b> coroa de bordas, braços longos e um sino que se contrai antes do pulso.</li><li><b>Peixinho:</b> gordinho, com rabo grande e nadadeira que bate.</li><li><b>Tubarões:</b> barbatana no dorso, focinho pontudo e bocarra que abre antes da mordida. O Martelo balança a cabeça.</li><li><b>Polvo:</b> cabeça à frente e braços com ventosas que se abrem e fecham ao nadar.</li><li><b>Cavalo-marinho:</b> coroa, pescoço curvo e cauda que enrola. Antes de atirar, aponta o focinho para você.</li><li><b>Peixe-Diabo Abissal:</b> isca dupla e pontos luminosos que desenham o corpo no escuro.</li><li><b>Rastro do nudibrânquio:</b> uma mancha de lodo única, sem parecer um corpo.</li><li><b>Retoques:</b> plâncton com cílios maiores, água-viva que pulsa para nadar, ouriço com pontas claras, baiacu com nadadeiras laterais e peixe-lanterna com brilho na borda.</li><li><b>Mini-chefes:</b> a Ameba-Mãe carrega filhotes dentro do corpo, e o Baiacu Colossal tem cicatrizes e pálpebras pesadas. A Lagosta Blindada ganhou placas e espinhos de verdade.</li></ul></li></ul><h4>Ajustes e correções</h4><ul><li><b>Andar de Lado saiu:</b> os poderes agora funcionam igual no toque e no teclado.</li><li><b>Senhor das Marés:</b> agora vale para todos os eventos de bioma.</li><li><b>Cura ao engolir:</b> tem o mesmo limite de 5% da vida por segundo do roubo de vida.</li><li><b>Mais frequentes de novo:</b> as Comuns clássicas (Garras, Fúria, Patas, Carapaça).</li><li><b>Contador de cargas:</b> o número de cargas do dash voltou a aparecer no botão de toque.</li><li><b>Teclado:</b> o Tab não trava mais no menu.</li><li><b>Dicas:</b> a dica de uma partida não continua na tela depois de \"Jogar de novo\".</li><li><b>Textos:</b> \"da Lagosta\", \"da Moreia\" e afins nas partes.</li></ul>"}

function applyCond(ch){
 const prev=run.pf;run.cnd=null;run.cndShow=0;run.pf=null;run.rw=null;run.sites=[];/* [etapa-59] */
 if(run.mode!=='camp')return;
 const b=run.biome;let c=null;
 if(ECO.conds){
  if(ECO_FORCE){const f=COND_BY[ECO_FORCE];if(f&&(f.b===b||(f.b==null&&b>=f.min)))c=f;}
  else if(ch&&COND_BY[ch.id])c=COND_BY[ch.id];
  else if(!(b===0&&!(META.bosses>0))){const l=condList(b);if(l.length)c=l[Math.floor(RNG.eco()*l.length)];} // proteção de quem está aprendendo: sem condição na Poça até a 1ª vitória sobre a Ameba-Mãe
 }
 if(c){
  const B=BIOMES[b],o={id:c.id,bi:b};
  if(c.sp){o.spawn={};for(const k in B.spawn)o.spawn[k]=B.spawn[k]*(c.sp[k]==null?1:c.sp[k]);}
  if(c.ev)o.ev=c.ev;if(c.evI)o.evI=c.evI;if(c.afx)o.afx=c.afx;if(c.dark!=null)o.dark=c.dark;if(c.xp)o.xp=c.xp;
  run.cnd=o;
 }
 if(ECO.perfil)run.pf=ch&&ch.pf||rollPerfil(b,c&&c.id,prev); // [etapa-58]
 if(ch&&ch.rw){run.rw=ch.rw;run.rwB=b;}
 if(c||run.pf)run.cndShow=3.2; // a faixa da condição entra depois da faixa do bioma
 run.evT*=evMul();
 if(c||run.pf){const s=statB();if(s){s.cnd=c?c.id:null;s.pf=run.pf;s.rw=run.rw;}} // [etapa-58] telemetria (I7)
 genSites(); // [etapa-59] marcos do bioma (lê o perfil e a condição)

}

// O cartão descreve a situação, não os números. Os sorteios usam RNG.ecoR, um gerador da família eco consumido só nas
// passagens de bioma e sempre o mesmo número de vezes. Assim a mesma semente (desafio diário) oferece as mesmas descidas,
// aconteça o que acontecer durante o bioma (RNG.eco também é usado pelas estirpes no meio da luta).

const pfOn=()=>!!(run&&run.pf&&run.mode==='camp');
const rwOn=k=>!!(run&&run.rw===k&&run.rwB===run.biome&&run.mode==='camp'); // só no bioma da descida
const evMul=()=>(cndOn()&&run.cnd.evI||1)*(pfOn()&&run.pf==='agitado'?.75:1); // Agitado: intervalo entre eventos −25%

function rollPerfil(b,cid,prev){
 const x=RNG.ecoR(); // consumido sempre, para que a proteção da Poça não desloque as descidas seguintes
 if(b===0&&!(META.bosses>0))return 'calmo'; // bioma 1 nas primeiras partidas: sempre Calmo
 const w={calmo:1,normal:2,agitado:prev==='agitado'?0:1},m=PF_COND[cid]; // nunca dois Agitados seguidos
 if(m)for(const k in m)w[k]*=m[k];
 return pickW(w,()=>x);
}
function rollDescidas(nb){
 const l=condList(nb).slice(),rk=Object.keys(RECOMP),prev=run.pf,o=[];
 for(let i=0;i<2&&l.length;i++){const c=l.splice(Math.floor(RNG.ecoR()*l.length),1)[0],rw=rk.splice(Math.floor(RNG.ecoR()*rk.length),1)[0];
  o.push({id:c.id,rw,pf:ECO.perfil?rollPerfil(nb,c.id,prev):null});}
 /* [etapa-63] Cartografia: 3ª descida. Sorteada com um gerador local semeado pelas 2 primeiras, sem tocar no RNG.ecoR:
    as 2 primeiras e as descidas seguintes são as mesmas com e sem Cartografia (e a diária continua igual para todos) */
 if((META.up.carto||0)>0&&o.length===2&&l.length&&rk.length){let h=nb*7919+1;for(const q of o)for(const ch of q.id+q.rw)h=(h*31+ch.charCodeAt(0))>>>0;const g=mulberry32(h);
  const c=l[Math.floor(g()*l.length)],rw=rk[Math.floor(g()*rk.length)];let pf=null;
  if(ECO.perfil){const w={calmo:1,normal:2,agitado:prev==='agitado'?0:1},m=PF_COND[c.id];if(m)for(const k in m)w[k]*=m[k];pf=pickW(w,g);}
  o.push({id:c.id,rw,pf,carto:1});}
 return o;
}

// [etapa-59] Marcos do Bioma (P3 do plano de enriquecimento): lugares persistentes que valem um desvio e competem pelo
// tempo do cronômetro. Chave ECO.marcos. Duas famílias nesta etapa (o Território fica para a 60):
//   rec  Recurso: usado várias vezes enquanto você está dentro, até se esgotar (q = segundos de uso)
//   fen  Fenômeno: uso único; ficar 1 s dentro ativa um efeito POSICIONAL (vale só dentro do raio), nunca um buff portátil
// Quantidade pelo perfil (58): Calmo 1 (sempre Recurso), Normal 2, Agitado 3. Nunca mais de 3.
// Estado em run.sites[]. O marco fica até ser usado/esgotado ou até o chefe do bioma morrer.
// Sorteio com RNG.ecoM, um gerador da família eco consumido só na entrada do bioma e sempre 12 vezes. Assim a mesma
// semente dá os mesmos marcos (desafio diário), e ligar os marcos não desloca as descidas da 58 nem as estirpes da 57.
// Distância (59.1): 650–1000 px para a Célula até 900–1500 px para o Caranguejo. Faro: 560 px + 60 por estágio, vezes a build.
// Descoberta: a seta de borda só aparece DEPOIS da detecção. Detecta ao ver (o marco entra na tela, com a margem do anúncio)
// ou ao farejar (raio siteR, que cresce com ps.vision e ps.det: Antenas Sensíveis, Antenas Longas e Quimiorrecepção).
// Sinal fraco: marco não detectado em 20 s ganha uma seta pálida com erro de até ±45°, que fica precisa ao se aproximar.
const SITES={
 carcaca:{fam:'rec',ic:'🦴',n:'Carcaça',r:160,q:14,col:'240,226,196',f:'Cura e DNA enquanto você fica perto, mas atrai predadores.'},

 termal:{fam:'rec',ic:'♨️',n:'Fonte Termal',r:150,q:20,col:'255,140,80',lit:1,f:'Nódulos de DNA. Cura com Quimiossíntese; sem ela, superaquece.'},

 muda:{fam:'fen',ic:'🥚',n:'Bolsão de Muda',g:'o',r:200,dur:20,col:'169,230,255',f:'Fique 1 s: cura e os 3 próximos golpes que você levar ali são bloqueados.'},

const SITE_BIO=[['leito','carcaca','muda','desova'],['desova','leito','carcaca','muda'],['carcaca','leito','muda','neve'],['neve','carcaca','termal','leito'],['termal','carcaca','muda','neve']];
const SITE_COND={fossa_ativa:'termal',baleias:'carcaca',primavera:'leito',neve:'neve',desova:'desova',mare_baixa:'carcaca'};
const SITE_N={calmo:1,normal:2,agitado:3};
const SITE_WEAK=20,SITE_ERR=Math.PI/4;
const sitesOn=()=>!!(ECO.marcos&&run&&run.mode==='camp'&&run.sites&&run.sites.length);
// raio de faro: começa curto e cresce com a build; o escuro encurta (menos para os marcos que brilham)
function siteR(s){const d=bDark();return (560+60*P.stage)*ps.vision*(ps.det||1)*(1-(SITES[s.k].lit?.1:.3)*Math.min(1,d/.6));}
function genSites(){
 run.sites=[];if(!ECO.marcos||run.mode!=='camp')return;
 const R=RNG.ecoM,x=[];for(let i=0;i<12;i++)x.push(R()); // 12 sorteios sempre, para não deslocar o bioma seguinte
 const b=run.biome,n=Math.min(3,SITE_N[run.pf]||2),fav=cndOn()&&SITE_COND[run.cnd.id],l=SITE_BIO[b].slice(),ks=[];
 for(let i=0;i<n&&l.length;i++){
  const pool=i===0?l.filter(k=>SITES[k].fam==='rec'):l; // o 1º é sempre um Recurso (o único, no Calmo)
  const w={};for(const k of pool)w[k]=k===fav?3:1;const k=pickW(w,()=>x[i]);ks.push(k);l.splice(l.indexOf(k),1);}
 if(ECO.alfa){const xa=RNG.ecoA();if(terCan()&&ks.length>1&&xa<terP())ks[ks.length-1]='territorio';} // [etapa-60] Território no lugar do último marco (Normal e Agitado); 1 sorteio de RNG.ecoA sempre
 const a0=x[3]*TAU,st=Math.min(4,P.stage); // distância pelo estágio de quem entra: Célula 650–1000 px, Caranguejo 900–1500 px (protótipo 59.1)
 ks.forEach((k,i)=>{let a=a0+i*TAU/ks.length+(x[4+i]-.5)*.8,d=650+62.5*st+x[7+i]*(350+62.5*st),sx=0,sy=0;
  for(let t=0;t<4;t++){sx=clamp(P.x+Math.cos(a)*d,280,WORLD-280);sy=clamp(P.y+Math.sin(a)*d,280,WORLD-280);if(Math.hypot(sx-P.x,sy-P.y)>=Math.min(700,d*.95))break;a+=Math.PI/2;}
  run.sites.push({k,x:sx,y:sy,t:0,det:0,how:null,q:SITES[k].q||0,inT:0,act:0,blk:0,used:false,gone:0,sT:0,err:(x[10+(i%2)]*2-1)*SITE_ERR,id:i});});
 const s=statB();if(s)s.mc=run.sites.map(q=>({k:q.k,det:null,how:null,use:null,end:null}));
 if((META.up.faro||0)>0)for(const q of run.sites)if(q.k==='territorio'){q.det=1;q.how='faro';const st=siteStat(q);if(st){st.det=0;st.how='faro';st.st=P.stage;}for(let i=toasts.length-1;i>=0;i--)if(toasts[i].faro)toasts.splice(i,1);/* o newGame do fundo do menu não deixa aviso velho */toasts.push({txt:'👃 Faro: '+SITES.territorio.ic+' Território no mapa. '+SITES.territorio.f,t:4,faro:1});} // [etapa-63] Saber
}

// [etapa-60] terceira família dos Marcos do Bioma (P3): o Território. Chave ECO.alfa (com ECO.marcos ligada).
// Entra no sorteio dos marcos nos perfis Normal e Agitado (nunca é o 1º marco, que é sempre um Recurso).
// Um Alfa (elite com 2 afixos, um pouco maior) guarda as pedras e NUNCA sai de um raio de 320 px do centro.
// O mundo só existe em volta do jogador (spawnPos nasce em anel; a 2700 px a criatura some), então a regra é do LUGAR:
//   1. enquanto o Alfa vive, as presas dele não nascem a menos de 600 px do território (sorteia-se outra espécie);
//   2. presas que entram nesse raio fogem para fora;
//   3. quando o Alfa morre, por 30 s as presas dele têm peso ×1,5 nos nascimentos a menos de 600 px, e as que fugiram
//      por perto voltam às pedras;
//   4. a partir de 20 s depois da morte, um predador concorrente da tabela do bioma nasce mais ali (peso ×3).
// Recompensa: uma escolha de parte (a partir do estágio 2) ou muito DNA. Faixa de uma linha anuncia a volta das presas.
// Sorteios novos: se há Território, 1 vez por bioma com RNG.ecoA (o Território toma o lugar e a posição do último marco,
// então os marcos da 59 não mudam); a troca de espécie no nascimento usa RNG.eco (a família eco das partidas).
// Nenhum dos dois desloca cartas, partes, nascimentos, elites, eventos, descidas (RNG.ecoR) nem marcos (RNG.ecoM).
const TER_BIO=[
 {a:'ameba',afx:['veloz','regenerador'],prey:['plancton'],comp:'eremita',txt:'Sem o Alfa, o plâncton voltou às pedras.',ct:'🐚 Um ermitão veio disputar as pedras.'},
 {a:'baiacu',afx:['blindado','explosivo'],prey:['eremita','peixinho'],comp:'enguia',txt:'Sem o Alfa, os ermitões voltaram às pedras.',ct:'🐍 Uma enguia veio disputar as pedras.'},
 {a:'polvo',afx:['veloz','venenoso'],prey:['peixinho','cavalo'],comp:'rival',txt:'Sem o Alfa, os cavalos-marinhos voltaram às algas.',ct:'🦀 Um caranguejo rival veio disputar as algas.'},
 {a:'lanterna',afx:['regenerador','venenoso'],prey:['peixinho','aguaviva'],comp:'polvo',txt:'Sem o Alfa, as águas-vivas voltaram às pedras.',ct:'🐙 Um polvo veio disputar as pedras.'},
 {a:'rival',afx:['blindado','regenerador'],prey:['peixinho','nudi'],comp:'lanterna',txt:'Sem o Alfa, os nudibrânquios voltaram às fontes.',ct:'🏮 Um peixe-lanterna veio disputar as fontes.'},
];
const TER_LEASH=320,TER_ZONE=600,TER_BOOST=30,TER_COMPT=20,TER_PW=1.5,TER_CW=3;
// chance de o último marco virar Território; a condição Disputa de Território (Floresta) favorece
const TER_P={normal:.4,agitado:.6},terP=()=>Math.min(.9,(TER_P[run.pf]||0)+(cndOn()&&run.cnd.id==='territorio'?.3:0));
const hasAfx=(e,a)=>e.elite===a||e.el2===a;
const terOn=()=>!!(ECO.alfa&&sitesOn());
const terCan=()=>!!(ECO.alfa&&ECO.marcos&&run&&run.mode==='camp'&&(run.pf==='normal'||run.pf==='agitado')&&TER_BIO[run.biome]);
const terSite=()=>{if(!terOn())return null;for(const s of run.sites)if(s.k==='territorio'&&!s.gone)return s;return null;};
let TS=null,TPREY={}; // território com Alfa vivo (recalculado a cada quadro em terUpdate) e presas dele
const TF={x:0,y:0};
// o Alfa: elite com os 2 afixos do bioma, um pouco maior (+15%; a vida é a de elite, e os dois afixos o deixam mais duro), que não é engolido nem some de longe
function terMakeAlfa(s){
 const T=TER_BIO[run.biome],e=makeEnemy(T.a,s.x,s.y,false);
 e.elite=T.afx[0];e.el2=T.afx[1];e.alfa=s;e.noEat=true;
 e.r*=1.25*1.15;e.baseR=e.r;e.hp=e.max=e.max*2.2;e.xp*=3*2;e.dmg*=1.2*1.1;
 for(const a of T.afx){if(a==='veloz')e.spd*=1.6;if(a==='blindado'){e.hp=e.max=e.max*1.5;e.armor=.4;}}
 s.al=e;s.alT=0;return e;
}
// coleira: o centro do Alfa nunca passa de 320 px do território; a velocidade para fora é anulada e ele vira para dentro
function terLeash(e){
 const s=e.alfa,dx=e.x-s.x,dy=e.y-s.y,d=Math.hypot(dx,dy);if(d<=TER_LEASH)return;
 const nx=dx/d,ny=dy/d;e.x=s.x+nx*TER_LEASH;e.y=s.y+ny*TER_LEASH;const vn=e.vx*nx+e.vy*ny;if(vn>0){e.vx-=vn*nx;e.vy-=vn*ny;}
 e.wa=Math.atan2(-ny,-nx);if(e.st==='go'){e.st='idle';}
}
// regra 2: presa do Alfa dentro de 600 px do território foge para fora (vetor em TF). A fuga só termina a 720 px e a presa
// sai virada para fora: sem isso ela fica na borda, entrando e saindo (medido no protótipo 60.1)
const TER_OUT=TER_ZONE+120;
function terFlee(e){
 if(!TS||!TPREY[e.k]||e.boss||e.hide>0)return false;
 const dx=e.x-TS.x,dy=e.y-TS.y,d=Math.hypot(dx,dy);
 if(d>=TER_OUT||(d>=TER_ZONE&&e.fled!==1)){if(e.fled===1){e.fled=2;e.wa=Math.atan2(dy,dx);}return false;}
 TF.x=dx/(d||1);TF.y=dy/(d||1);e.fled=1;return true;
}
// regra 3 (retorno): depois da morte do Alfa, presas que estavam por perto nadam de volta às pedras por alguns segundos
function terHome(e,dt){
 const s=e.home;e.homeT-=dt;const dx=s.x-e.x,dy=s.y-e.y,d=Math.hypot(dx,dy);
 if(d<200||s.gone){e.homeT=0;e.home=null;return false;}TF.x=dx/d;TF.y=dy/d;return true;
}
// regras 1, 3 e 4 no nascimento: o ponto sorteado caiu a menos de 600 px do território → a espécie é sorteada de novo
function terPick(k,x,y){
 const s=terSite();if(!s)return k;const T=TER_BIO[run.biome];
 if(Math.hypot(x-s.x,y-s.y)>=TER_ZONE)return k;
 const st=siteStat(s),w=Object.assign({},bSpawn());
 if(!s.used){if(!T.prey.includes(k))return k;for(const q of T.prey)delete w[q];if(st)st.ban=(st.ban||0)+1;return pickW(w,RNG.eco);}
 const f=s.free||0,boost=f<TER_BOOST,comp=f>=TER_COMPT&&w[T.comp]>0;if(!boost&&!comp)return k;
 if(boost)for(const q of T.prey)if(w[q])w[q]*=TER_PW;if(comp)w[T.comp]*=TER_CW;
 const k2=pickW(w,RNG.eco);
 if(st){if(T.prey.includes(k2))st.pn=(st.pn||0)+1;if(k2===T.comp){st.cn=(st.cn||0)+1;if(!s.compSaid){s.compSaid=1;toasts.push({txt:T.ct,t:3.5});}}}
 return k2;
}
// o Alfa morreu pela mão do jogador: recompensa, fim da proibição, presas voltam e a faixa anuncia
function terKill(e){
 const s=e.alfa;if(!s||s.used)return;const T=TER_BIO[run.biome];
 siteUse(s);s.free=0;s.al=null;const st=siteStat(s);if(st){st.al=+s.t.toFixed(1);st.ast=P.stage;st.alT=+(s.alT||0).toFixed(1);}
 if(P.stage>=2){pendingPart++;toasts.push({txt:'🧩 Troféu do Alfa: uma nova parte!',t:3.5});}
 else{const xp=need(P.level)*.7/ps.xpMul,n=10;for(let i=0;i<n&&orbs.length<160;i++){const a=i*TAU/n;orbs.push({x:e.x+Math.cos(a)*e.r,y:e.y+Math.sin(a)*e.r,vx:Math.cos(a)*160,vy:Math.sin(a)*160,v:xp/n,t:0});}toasts.push({txt:'🧬 Troféu do Alfa: muito DNA!',t:3.5});}
 banner={txt:T.txt,t:3.2};snd(330,.5,'triangle',.05,220,'event');
 let n=0;for(const q of enemies){if(n>=8)break;if(q.dead||!T.prey.includes(q.k)||q.mig)continue;const d=Math.hypot(q.x-s.x,q.y-s.y);if(d>200&&d<1500){q.home=s;q.homeT=12;n++;}}
 if(st)st.ret=n;
}
// chamado por siteUpdate para o marco Território (inside = jogador dentro da coleira)
function terUpdate(s,dt,inside){
 const T=TER_BIO[run.biome];if(!T)return;
 if(!s.used){
  if(!s.al)terMakeAlfa(s);
  const e=s.al;if(e.dead){s.used=true;s.free=0;s.al=null;}else{terLeash(e);const d=Math.hypot(e.x-s.x,e.y-s.y);if(d>(s.lmax||0))s.lmax=d;if(e.hp<e.max)s.alT+=dt;}
  if(inside)siteStat(s)&&(siteStat(s).fight=1);
 }else s.free=(s.free||0)+dt;
 // amostra (telemetria 60.1): presas dentro de 600 px, com o jogador perto o bastante para ver o lugar
 s.smT=(s.smT||0)-dt;if(s.smT<=0){s.smT=.5;const st=siteStat(s);
  if(st&&Math.hypot(P.x-s.x,P.y-s.y)<1100){let n=0;for(const q of enemies)if(!q.dead&&T.prey.includes(q.k)&&Math.hypot(q.x-s.x,q.y-s.y)<TER_ZONE)n++;
   const ph=!s.used?'v':(s.free<TER_BOOST?'d':'p');st['n'+ph]=(st['n'+ph]||0)+n;st['m'+ph]=(st['m'+ph]||0)+1;}}
}
// antes do laço de inimigos: qual território tem Alfa vivo, e quais são as presas dele
function terFrame(){
 TS=null;if(!terOn())return;const s=terSite();if(!s||s.used)return;TS=s;
 const T=TER_BIO[run.biome];if(TPREY.b!==run.biome){TPREY={b:run.biome};for(const q of T.prey)TPREY[q]=1;}
}

// Depois da morte do Alfa, os riscos apagam e as bolhas ficam ralas. RM congela as bolhas; HC dá contorno claro e grosso.
function terDraw(s,T,ol,ow){
 const free=!!s.used,R0=[[-78,-26,46],[64,-44,40],[18,52,54],[-46,62,32],[96,40,28]];
 ctx.fillStyle='rgba(40,30,20,.25)';ctx.beginPath();ctx.ellipse(0,14,150,96,0,0,TAU);ctx.fill();
 R0.forEach(([x,y,r],i)=>{
  ctx.beginPath();for(let j=0;j<8;j++){const a=j*TAU/8+hash(i,j+40)*.4,rr=r*(.78+.3*hash(i,j+50));if(j)ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr*.78);else ctx.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr*.78);}ctx.closePath();
  ctx.fillStyle=['#5c4f45','#6a5a4c','#544840'][i%3];ctx.strokeStyle=ol;ctx.lineWidth=ow;ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.08)';ctx.beginPath();ctx.ellipse(x-r*.25,y-r*.3,r*.45,r*.22,-.3,0,TAU);ctx.fill();
  // riscos de garra: três traços paralelos claros (marcam o dono)
  ctx.strokeStyle=HC?'#ffffff':`rgba(255,214,160,${free?.25:.9})`;ctx.lineWidth=HC?3.5:2.6;ctx.lineCap='round';ctx.beginPath();
  for(let k=0;k<3;k++){const ox=x-r*.35+k*r*.22,oy=y-r*.3;ctx.moveTo(ox,oy);ctx.lineTo(ox+r*.32,oy+r*.55);}ctx.stroke();});
 // anúncio: bolhas subindo entre as pedras
 const T2=RM?0:time,nb=free?4:10;ctx.strokeStyle=HC?'#ffffff':'rgba(220,240,255,.7)';ctx.lineWidth=1.6;
 for(let i=0;i<nb;i++){const ph=((T2*.5+i/nb)%1),bx=[-30,40,-10,70,10][i%5]+Math.sin(ph*8+i)*6*(RM?0:1),by=10-ph*240;const ga=ctx.globalAlpha;ctx.globalAlpha=ga*(RM?.7:1-ph*.8);ctx.beginPath();ctx.arc(bx,by,3+ph*6,0,TAU);ctx.stroke();ctx.globalAlpha=ga;}

/* ================= Pressão Populacional e afinidades dos eventos ================= */
// [etapa-61] P4 e I1 do plano de enriquecimento.
//
// Pressão Populacional (chave ECO.pressao, só na Campanha, como os marcos):
//   run.pop.n[kind] = pressão de caça no bioma atual. +1 a cada criatura da espécie morta ou engolida (killEnemy),
//   −1 a cada 30/K s sem caçá-la. 0 <= n <= K, com K = max(8, round(0.4 * peso da espécie)) (peso já com a condição).
//   Peso efetivo no nascimento: w * (1 - 0.4 * n/K), recalculado a cada 2 s (spawnRandom lê a tabela pronta).
//   Desvio do plano: ele escreve w * max(0.6, 1 - n/K), que chega ao piso já em n = 0,4·K (4 peixinhos), mas define K como
//   "a quantidade que leva ao piso". Na 1ª medição, com a fórmula literal, 2 a 4 espécies rareavam por bioma (uma faixa
//   a cada ~20 s). Aqui o piso 0,6 chega exatamente em n = K, como o plano descreve.
//   Só composição: o alvo de população e o DNA de cada criatura não mudam. O sorteio continua sendo 1 chamada de
//   RNG.spawn por nascimento, então nenhum outro sorteio se desloca. Zera ao trocar de bioma.
//   Ao chegar ao piso (n = K), faixa de uma linha "Os peixinhos rarearam." (uma vez por espécie e bioma).
//
// Afinidades dos eventos (chave ECO.afinidades): um gancho por evento passivo, só com a build correspondente.
//   Corrente: dash a favor da corrente vai 30% mais longe (build de dash)
//   Floração: o Frenesi dura o dobro (build de engolir)
//   Migração: Cardume Aliado ganha +2 peixinhos enquanto o cardume passa
//   Erupção: as fendas ferem inimigos também (Quimiossíntese)
const POP_FLOOR=.6,POP_REC=30,POP_WT=2;
const POP_TXT={plancton:'O plâncton rareou.',ameba:'As amebas rarearam.',peixinho:'Os peixinhos rarearam.',aguaviva:'As águas-vivas rarearam.',ourico:'Os ouriços rarearam.',
 eremita:'Os ermitões rarearam.',enguia:'As enguias rarearam.',baiacu:'Os baiacus rarearam.',cuspidor:'Os cuspidores rarearam.',arraia:'As arraias rarearam.',polvo:'Os polvos rarearam.',
 rival:'Os caranguejos rivais rarearam.',cavalo:'Os cavalos-marinhos rarearam.',lanterna:'Os peixes-lanterna rarearam.',tubarao:'Os tubarões rarearam.',nudi:'Os nudibrânquios rarearam.'};
const popOn=()=>!!(ECO.pressao&&run&&run.mode==='camp');
function popReset(){run.pop={b:run.biome,n:{},d:{},w:null,wT:POP_WT,rare:{},q:[]};}
function popSync(){if(!run.pop||run.pop.b!==run.biome)popReset();return run.pop;}
const popK=(w)=>Math.max(8,Math.round(.4*w));
// multiplicador de peso de uma espécie (1 sem pressão; piso 0,6)
function popMul(k){const o=run.pop,base=bSpawn();if(!o||!o.n[k]||!base[k])return 1;return Math.max(POP_FLOOR,1-(1-POP_FLOOR)*o.n[k]/popK(base[k]));}
// tabela usada no nascimento: a do bioma (com a condição) ou a recalculada pela pressão
function popSpawnW(){if(!popOn())return bSpawn();const o=popSync();return o.w||bSpawn();}
function popRecalc(){if(!popOn())return;const o=popSync(),base=bSpawn();let any=false;const w={};for(const k in base){const m=popMul(k);if(m<1)any=true;w[k]=base[k]*m;}o.w=any?w:null;}
function popKill(e){ // chamado em killEnemy (morta ou engolida)
 if(!popOn()||e.boss||e.nest/* [etapa-65] */)return;const o=popSync(),base=bSpawn();if(!base[e.k])return;{const b=statB();if(b)b.popN=(b.popN||0)+1;}
 const K=popK(base[e.k]);o.n[e.k]=Math.min(K,(o.n[e.k]||0)+1);o.d[e.k]=0;
 if(!o.rare[e.k]&&o.n[e.k]>=K){o.rare[e.k]=1;o.q.push(POP_TXT[e.k]||'Uma espécie rareou.');
  if(!META.rare)META.rare={};if(!META.rare[e.k]){META.rare[e.k]=1;codexDirty=true;}
  const b=statB();if(b)(b.rare=b.rare||[]).push(e.k);}}
function popUpdate(dt){
 if(!popOn())return;const o=popSync(),base=bSpawn();
 for(const k in o.n){if(!(o.n[k]>0))continue;const per=POP_REC/popK(base[k]||1);o.d[k]=(o.d[k]||0)+dt;while(o.d[k]>=per&&o.n[k]>0){o.d[k]-=per;o.n[k]--;}if(o.n[k]<=0){delete o.n[k];delete o.d[k];}}
 o.wT-=dt;if(o.wT<=0){o.wT=POP_WT;popRecalc();}
 if(o.q.length&&!banner)banner={txt:o.q.shift(),t:2.5}; // não atropela a faixa de um evento ou de um marco
}
const popRareN=()=>Object.keys(META.rare||{}).length; // Códex: "Você fez N espécies rarearem"

// ---- afinidades
const AF_BAN={corrente:'💨 CORRENTE MARINHA! Seu dash a favor dela vai 30% mais longe.',floracao:'🌼 FLORAÇÃO DE PLÂNCTON! +30% de DNA e o Frenesi dura o dobro.',
 migracao:'🐡 MIGRAÇÃO! Um cardume atravessa e 2 peixinhos se juntam ao seu.',erupcao:'♨️ ERUPÇÃO TERMAL! As fendas acendem e ferem os inimigos também.'};
function afBuild(t){
 if(t==='corrente')return MUTS.some(m=>m.dash&&P.mut[m.id]);
 if(t==='floracao')return !!(P.mut.gula||P.mut.f_leviata||P.mut.perola);
 if(t==='migracao')return !!P.mut.cardume;
 if(t==='erupcao')return !!(P.mut.quimio_s||P.mut.f_necro);
 return false;}
const afAct=t=>!!(ECO.afinidades&&run&&run.ev&&run.ev.type===t&&afBuild(t));
function afStat(t){const b=statB();if(b){b.af=b.af||{};b.af[t]=(b.af[t]||0)+1;}}
// no começo do evento: troca o texto da faixa quando o jogador tem a build
function afBanner(){const t=run.ev&&run.ev.type;if(AF_BAN[t]&&afAct(t)&&banner){banner.txt=AF_BAN[t];afStat(t);}}
// Corrente: chamado em startDash depois de escolher a direção
function afDash(){if(!afAct('corrente'))return;const a=run.ev.a;if(P.ddx*Math.cos(a)+P.ddy*Math.sin(a)>.5){P.dashT*=1.3;P.afDash=(P.afDash||0)+1;const b=statB();if(b)b.afD=(b.afD||0)+1;}}
// Erupção: a fenda que explode fere os inimigos em volta
function afVent(z){if(z.t!=='vent'||!afAct('erupcao'))return;let n=0;
 for(const e of enemies){if(e.dead||e.under)continue;if(Math.hypot(e.x-z.x,e.y-z.y)<z.r+e.r*.5){DSRC='fendas';damageEnemy(e,ps.dmg*1.5,Math.atan2(e.y-z.y,e.x-z.x),true);DSRC=null;n++;}}
 if(n){const b=statB();if(b)b.afV=(b.afV||0)+n;}}
/* ================= Infinito de horas ================= */
// [etapa-64] Playtest de 24/11, propostas A e B.
//
// A. Cartas contínuas: com todas as mutações e fusões feitas (sobrando só trocas de especial), rollCards sorteia 3 (ou 4) cartas de CONT, sem teto e com
//    retorno decrescente: bônus total de n níveis = a · n^p (%). Cada escolha cura 25% da vida. Dá para banir e sortear de novo.
//    Substituem o Banquete (+3% de vida e dano até +90%, depois só cura); P.prest de uma partida antiga vira níveis de dano e vida.
//    No Infinito, need() deixa de ser exponencial depois do nível 40 (linear) e o DNA das criaturas cresce com o tempo,
//    para os níveis (e as cartas) continuarem chegando. A Ascensão (+12% a cada 4 níveis) continua: as duas crescem com o
//    nível. Medidas juntas, as duas somadas disparavam (nível 280 e Ascensão 60 aos 120 min, sem perigo nenhum):
//    no Infinito a Ascensão para em INF.ascMax, e depois disso o crescimento vem só das cartas (escolha do jogador).
// B. Curva do Infinito: sem os termos exponenciais (1,045^m e 1,035^m). Fica o polinômio de grau 2, que sempre sobe.
//    "Continuar no Infinito" segue a curva de onde a Campanha parou, piso de dano menor. Indicador "Correntes ×N" no HUD e na faixa dos 5 min.
// Constantes em INF. A Campanha não muda (need, curva e DNA só mudam com run.mode==='inf').
const INF={hpL:.11,hpQ:.012,dmL:.07,dmQ:.006, // curva: 1 + L·m + Q·m² (× rate da dificuldade)
 contOff:30,contXp:.6,                        // "Continuar no Infinito": a curva começa como se os minutos da Campanha (até contOff = 30) já fossem de Infinito
                                               //   (era um fator 1 + 6%·min sem teto) e o DNA das criaturas vale contXp (o jogador fica na Fossa, que dá 2× DNA;
                                               //   do zero, o ciclo de biomas dá 1,5× em média)
 floorT:10,floorK:.001,floorMax:.04,floorBig:1.5, // piso de dano: 0,1% por minuto depois dos 10, até 4% (×1,5 elite e chefe); era até 7% (×2)
 xpT:.05,                                       // DNA das criaturas no Infinito: +5% por minuto (substitui o DNA dos chefes, que ficou menor)
 needK:.05,                                     // need depois do 40 no Infinito: need(40) × (1 + 5% por nível)
 bossXp:.5,bossXpMini:.3,                     // DNA do chefe no Infinito, em níveis (era 1,6 e 0,9: na parte longa os chefes viravam fábrica de níveis)
 heal:.25,                                     // cura de cada carta contínua
 ascMax:10};                                   // Ascensão no Infinito para em 10 (+120%); depois o crescimento vem das cartas contínuas
const CONT=[
 {id:'c_dmg',ic:'🗡️',n:'Hipertrofia',a:6,p:.85,u:'de dano'},
 {id:'c_hp',ic:'❤️',n:'Carapaça Espessa',a:6,p:.85,u:'de vida'},
 {id:'c_rate',ic:'⚡',n:'Reflexos',a:3,p:.75,u:'de ritmo de ataque'},
 {id:'c_range',ic:'📏',n:'Quelas Longas',a:2.5,p:.7,u:'de alcance'},
 {id:'c_spd',ic:'🌀',n:'Nado Potente',a:2,p:.7,u:'de velocidade'},
 {id:'c_regen',ic:'💚',n:'Regeneração Contínua',a:.08,p:.85,u:'da vida por segundo',dec:2},
];
const CONT_BY={};for(const c of CONT)CONT_BY[c.id]=c;
const contTot=(id,n)=>{const c=CONT_BY[id];return n>0?c.a*Math.pow(n,c.p):0;};
function contB(id){return P&&P.cont?contTot(id,P.cont[id]||0):0;} // bônus total em %
const contN=()=>P&&P.cont?Object.values(P.cont).reduce((a,b)=>a+b,0):0;
function contMigrate(){if(!P.cont)P.cont={};if(P.prest>0){P.cont.c_dmg=(P.cont.c_dmg||0)+P.prest;P.cont.c_hp=(P.cont.c_hp||0)+P.prest;P.prest=0;}} // Banquete antigo → níveis

 while(pick.length<n&&av.length){const c=av.splice(Math.floor(RNG.cards()*av.length),1)[0];pick.push(Object.assign({cont:1},c));}return pick;}

// significado: o que você fez no bioma muda UM ataque do chefe (remove, enfraquece ou reforça). Nunca corta vida, então
// o ritmo mínimo da luta (BOSS_PACE) não muda. O cronômetro também não.
// Três modelos (tabela BOSS_PREP, uma entrada por chefe):
//   nin  Ninhos: 2 ninhos da espécie que o chefe invoca aparecem no começo da onda dele. Destruir os dois → não invoca.
//        Se tirar o ataque deixar menos de 2, enfraquece em vez de tirar (Ameba-Mãe: invoca 1 filha, 2 na fúria).
//   presa Presa do predador: f = n/K da presa dele no contador de caça da 61, na hora em que o chefe nasce.
//        f >= 0,75 → faminto: a fúria (fase 2) acelera ×1,15 em vez de ×1,3. f <= 0,15 → bem alimentado: a fúria
//        começa aos 55% da vida em vez de 50%. Entre os dois, nada muda. Precisa de ECO.pressao.
//   ter  Território: o Alfa (60) do bioma derrotado → o chefe perde uma vantagem do lugar. Precisa de ECO.alfa.
// Perfil (58): Calmo não tem preparação; Normal só no chefe; Agitado no mini-chefe e no chefe.
// Ninhos são marcos (família 'nin' em run.sites): detecção, seta, pausa e telemetria da 59. Um par por onda, que some
// quando o chefe nasce. Não entram na conta "no máximo 3 marcos por bioma": são o objetivo da onda, não um lugar de uso.
// Sorteio novo: posição dos ninhos com RNG.ecoP, 4 sorteios por onda de chefe (sempre, com a chave ligada na Campanha),
// para que a diária dê os mesmos ninhos e nenhum outro gerador se desloque.

 else if(T.m==='ter'){const s=prepTer();res=s&&s.used?'ok':'nao';

 {const b=statB();if(b&&b.prep){const q=b.prep[b.prep.length-1];if(q&&q.id===id){q.res=res;q.t0=+time.toFixed(1);e.prepQ=q;}}}

/* ================= Rainha Vermelha ================= */
// [etapa-66] Laboratório de mecânicas, ideia D. Chave ECO.coevo. Um chefe que te observou se adapta ao seu dano AUTOMÁTICO.
// Onde: na Campanha, só o Caranguejo Ancestral (lê o dano da campanha inteira). No Infinito (e no "Continuar"), chefes
// sorteados: 1 em 3, nunca dois seguidos, lendo o dano desde o chefe anterior. Sorteio com RNG.ecoV (1 por chefe do Infinito).
// Dano automático = projetil, bolhas, espinhos, anel, cardume, anemona, raio e ampolas. Golpe e dash nunca contam;
// marco e fendas (ambiente) ficam fora da conta (nem automático nem total).
// Se a parte automática passar de CV_TH, o chefe se adapta à FAMÍLIA dominante. Desvio do plano: o plano pedia 50%, mas na
// medição da 65 o bot ativo chegou a 58% (raio) numa semente, e os bots passivos ficam em 75–83%. Com 65% eles se separam.
// A adaptação não mexe na vida nem no dano do chefe: só no comportamento.
//   muco       bolhas e projéteis batem nele e voltam (no máx. 1 a cada 0,2 s, com 40% do dano dele; os outros grudam). Fraqueza: gira devagar
//   tentaculos espinhos e anel: ataca a 220 px (chicotada) e não encosta; a investida vira chicotada. Fraqueza: chicotada lenta
//              e lado cego atrás (golpes e dash pelas costas +30%)
//   cardume    cardume e anêmonas: a bocada mira seus aliados (cardume some 6 s, anêmonas comidas). Fraqueza: abre a guarda ao comer
//   frio       raio e ampolas: imune a veneno e a efeitos (abalo, fratura, quebra), raio e ampolas pela metade. Fraqueza: 20% mais lento
// Recompensa: no Infinito, a carta "Engolir a adaptação" (ocupa uma escolha). Na Campanha, Códex e uma conquista por adaptação.
const CV_TH=.65,CV_P=1/3;
const CV_SRC={projetil:'muco',bolhas:'muco',espinhos:'tentaculos',anel:'tentaculos',cardume:'cardume',anemona:'cardume',raio:'frio',ampolas:'frio'};
const CV_OUT={marco:1,fendas:1};
const CV={
 muco:{ic:'💧',n:'Muco',f:'seus projéteis voltam.',eat:'Seus projéteis ricocheteiam 1× em outro alvo.',col:'190,255,230'},
 tentaculos:{ic:'🦑',n:'Tentáculos Longos',f:'ataca de longe e não encosta em você.',eat:'Seus espinhos atingem quem estiver a até 90 px.',col:'255,150,190'},
 cardume:{ic:'🦈',n:'Predador de Cardume',f:'ele mira seus aliados primeiro.',eat:'Cardume e anêmonas causam 30% a mais de dano.',col:'255,210,120'},
 frio:{ic:'❄️',n:'Sangue Frio',f:'imune a veneno e efeitos; raio e ampolas pela metade.',eat:'Veneno em você dura metade do tempo.',col:'190,220,255'},
};
const CV_REACH=220,CV_MUCO_T=.2,CV_MUCO_D=.4; // Muco: no máx. 1 bolha devolvida a cada 0,2 s, com 40% do dano do chefe
let COEVO_FORCE=null; // testes e medição: família forçada (o Ancestral sempre se adapta a ela)
const cvOn=()=>!!(ECO.coevo&&run);
// dano por fonte somado em todos os biomas (a medição da 52 já guarda isso em run.stat)
function cvTotals(){const t={};for(const s of run.stat||[])if(s&&s.dmg)for(const k in s.dmg)t[k]=(t[k]||0)+s.dmg[k];return t;}
// parte automática e família dominante na janela (Campanha inteira, ou desde o último chefe no Infinito)
function cvRead(){
 const t=cvTotals(),b=run.cvBase||{},f={};let tot=0,auto=0;
 for(const k in t){if(CV_OUT[k])continue;const v=Math.max(0,t[k]-(b[k]||0));tot+=v;const fm=CV_SRC[k];if(fm){auto+=v;f[fm]=(f[fm]||0)+v;}}
 let fam=null,bx=0;for(const k in f)if(f[k]>bx){bx=f[k];fam=k;}
 return {sh:tot>0?auto/tot:0,fam,tot};
}
// o chefe nasceu: é um chefe que observou? (Campanha: o Ancestral; Infinito: sorteio)
function cvPick(e){
 if(!cvOn())return false;
 if(run.mode==='inf'){const x=RNG.ecoV();/* 1 sorteio por chefe, sempre */if(COEVO_FORCE)return true;const ok=x<CV_P&&!run.cvLast;run.cvLast=ok;return ok;}
 return e.id==='ancestral';
}
function cvApply(e){
