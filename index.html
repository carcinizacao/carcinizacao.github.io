/* ================= Dieta ================= */
// [etapa-67] P6 do plano de enriquecimento: você é o que come. Chave ECO.dieta (Campanha e Infinito).
// Medidor de assimilação por espécie: 5 "comidas" ativam; esvazia 1 a cada 4 s sem comer a espécie.
// O que conta como comer (desvio do plano, que contava só killEnemy(eaten)):
//   - engolir, OU abater com golpe ou dash (a mordida). Com o ataque automático, que é o padrão, a maioria das presas
//     engolíveis morre no golpe antes de encostar em você; e, sem mutações, a Célula não engole nada (ps.eat 0,5 × raio)
//     e o Caranguejo só engole plâncton, ameba e peixinho. Só com o engolir, a regra "≥ 3 espécies por bioma e estágio"
//     seria impossível;
//   - e só NADANDO (velocidade ≥ 35% da sua): é caça. O caranguejo parado nunca assimila (critério da etapa).
// Uma assimilação por vez. Formatos:
//   acumulável (20 s): comer a mesma espécie renova; a cada 5 comidas durante o efeito, +1 nível (até 3)
//   transformação (12 s fixos): não renova; o medidor dela só volta a encher depois que acaba
// Uma assimilação nova só troca a atual quando o medidor dela se completa. Bônus, nunca requisito.
// Efeitos aplicados em S() (dietS envolve o cálculo). Só espécies da tabela de nascimento do bioma atual contam.
// A Fossa só tinha 2 espécies da tabela do plano (plâncton e peixinho): entrou o cuspidor (Glândula), que existe do Recife à Fossa.
const DIET={
 plancton:{ic:'🍃',n:'Filtrador',f:'acu',d:'+15% de DNA'},
 ameba:{ic:'🦠',n:'Membrana',f:'acu',d:'+10% de armadura'},
 peixinho:{ic:'🐟',n:'Nado de Cardume',f:'acu',d:'+12% de velocidade e de recarga do dash'},
 aguaviva:{ic:'🎐',n:'Cnidas',f:'acu',d:'quem encosta em você é envenenado'},
 cavalo:{ic:'🌀',n:'Sucção',f:'acu',d:'+20% de alcance'},
 cuspidor:{ic:'💦',n:'Glândula',f:'acu',d:'+8% de ritmo de ataque'},
 baiacu:{ic:'🐡',n:'Inflar',f:'tr',d:'empurra quem encosta em você'},
 enguia:{ic:'⚡',n:'Descarga',f:'tr',d:'uma descarga a cada 3 s nos inimigos perto'},
 eremita:{ic:'🐚',n:'Concha',f:'tr',d:'bloqueia o próximo golpe'},
};
const DIET_N=5,DIET_DEC=4,DIET_ACU=20,DIET_TR=12,DIET_LV=3,DIET_SWIM=.35;
const dietOn=()=>!!(ECO.dieta&&run&&P);
function dietSync(){if(!P.diet)P.diet={m:{},d:{},cur:null};return P.diet;}
const dietLvK=l=>1+.5*((l||1)-1); // nível 1 ×1, 2 ×1,5, 3 ×2
// efeitos no S()
function dietS(o){
 const c=P&&P.diet&&P.diet.cur;if(!c||!ECO.dieta)return o;const k=dietLvK(c.lvl);
 if(c.k==='plancton')o.xpMul*=1+.15*k;
 else if(c.k==='ameba')o.armor=Math.min(.75,o.armor+.1*k);
 else if(c.k==='peixinho'){o.speed*=1+.12*k;o.dashCd/=1+.12*k;}
 else if(c.k==='aguaviva')o.cnidas=k;
 else if(c.k==='cavalo')o.range*=1+.2*k;
 else if(c.k==='cuspidor')o.atkRate*=1+.08*k;
 else if(c.k==='baiacu')o.inflar=1;
 return o;
}
// killEnemy: conta a comida (engolida, ou abatida com golpe/dash), nadando
function dietEat(e,eaten){
 if(!dietOn()||e.boss||e.nest||!DIET[e.k])return;
 if(!eaten&&DSRC!=='golpe'&&DSRC!=='dash')return;
 if(!bSpawnAll()[e.k])return; // só espécies do bioma atual
 const o=dietSync(),b=statB();
 if(Math.hypot(P.vx,P.vy)<DIET_SWIM*ps.speed){if(b)b.dtS=(b.dtS||0)+1;return;} // parado não caça
 if(b)b.dtE=(b.dtE||0)+1;
 const c=o.cur;
 if(c&&c.k===e.k){if(DIET[e.k].f==='tr')return;c.t=DIET_ACU;c.n++;if(c.n>=DIET_N&&c.lvl<DIET_LV){c.lvl++;c.n=0;ps=S();texts.push({x:P.x,y:P.y-ps.r-16,txt:DIET[e.k].ic+' nível '+c.lvl,col:'#b6ff9e',life:1.1,s:1,vy:-40});if(b)b.dtL=Math.max(b.dtL||0,c.lvl);}return;}
 o.m[e.k]=Math.min(DIET_N,(o.m[e.k]||0)+1);o.d[e.k]=0;
 if(o.m[e.k]>=DIET_N)dietActivate(e.k);
}
// tabela do bioma (no Infinito também)
const bSpawnAll=()=>typeof bSpawn==='function'?bSpawn():BIOMES[run.biome].spawn;
function dietActivate(k){
 const o=dietSync(),D=DIET[k];o.m[k]=0;o.d[k]=0;o.cur={k,lvl:1,n:0,t:D.f==='tr'?DIET_TR:DIET_ACU,zT:3};
 if(k==='eremita'&&!(P.shield>0)){P.shield=1;o.cur.sh=1;}
 ps=S();banner={txt:D.ic+' ASSIMILAÇÃO: '+D.n+'! '+D.d.charAt(0).toUpperCase()+D.d.slice(1)+' por '+(D.f==='tr'?DIET_TR:DIET_ACU)+' s.',t:2.6};snd(620,.3,'triangle',.05,300,'event');
 if(!META.diet)META.diet={};if(!META.diet[k]){META.diet[k]=1;codexDirty=true;}
 const b=statB();if(b){b.dt=b.dt||{};b.dt[k]=(b.dt[k]||0)+1;}
}
function dietUpdate(dt){
 if(!dietOn())return;const o=dietSync();
 for(const k in o.m){if(!(o.m[k]>0))continue;o.d[k]=(o.d[k]||0)+dt;while(o.d[k]>=DIET_DEC&&o.m[k]>0){o.d[k]-=DIET_DEC;o.m[k]--;}}
 const c=o.cur;if(!c)return;
 c.t-=dt;{const b=statB();if(b)b.dtT=(b.dtT||0)+dt;}
 if(c.k==='enguia'){c.zT-=dt;if(c.zT<=0){c.zT=3;const L=enemies.filter(e=>!e.dead&&!e.under&&e.k!=='plancton'&&!e.nest&&Math.hypot(e.x-P.x,e.y-P.y)<260).sort((a,b)=>Math.hypot(a.x-P.x,a.y-P.y)-Math.hypot(b.x-P.x,b.y-P.y)).slice(0,3);
  if(L.length){const pts=[[P.x,P.y]];for(const e of L){pts.push([e.x,e.y]);DSRC='descarga';damageEnemy(e,ps.dmg*.6,Math.atan2(e.y-P.y,e.x-P.x),true);DSRC=null;}if(fx.length<40)fx.push({t:'zap',pts,life:.22,max:.22});snd(1500,.07,'sawtooth',.03,-900,'zap');}}}
 if(c.k==='baiacu')for(const e of enemies){if(e.dead||e.boss||e.nest||e.alfa||(e.inflT||0)>time)continue;const dx=e.x-P.x,dy=e.y-P.y,d=Math.hypot(dx,dy)||1;if(d<ps.r*1.35+e.r){e.inflT=time+.6;e.vx=dx/d*420;e.vy=dy/d*420;e.st=e.st==='go'?'idle':e.st;}}
 if(c.t<=0){o.cur=null;ps=S();}
}
// hurtPlayer: Cnidas envenena quem encostou
function dietHurt(src){if(src&&!src.dead&&!src.boss&&ps.cnidas){src.pois=Math.max(src.pois||0,3);src.pdps=Math.max(src.pdps||0,ps.dmg*.25*ps.cnidas);}}
// pausa e Códex

// o medidor mais cheio que não é o da assimilação atual (regra 2: o HUD mostra a próxima antes)
function dietNext(){const o=P.diet;if(!o)return null;const sp=bSpawnAll();let k=null,bx=0;for(const q in o.m)if(o.m[q]>bx&&sp[q]&&(!o.cur||o.cur.k!==q)){bx=o.m[q];k=q;}return k;}
const dietCodex=k=>DIET[k]&&META.diet&&META.diet[k]?'🍽️ Assimilada: '+DIET[k].ic+' '+DIET[k].n+' ('+DIET[k].d+').':'';

/* ---------- desenho ---------- */
// junto do jogador (o Frenesi não tem ícone no HUD): ícone da assimilação com anel do tempo e, embaixo, o medidor da próxima
function drawDiet(){

 const x=P.x+ps.r+18,y=P.y-ps.r-18;ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';

  ctx.font='14px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';ctx.fillStyle='#fff';ctx.fillText(D.ic,x,y+1);

/* ================= Teia Trófica ================= */
// [etapa-68] P5 do plano de enriquecimento: predação entre criaturas, sem criatura nova. Chave ECO.teia (Campanha e Infinito).
// Um predador que NÃO está atrás do jogador procura uma presa da tabela PREY a menos de 220 px e, ao encostar, a engole.
// Regras:
//   1. presa comida por criatura não solta DNA (sai sem passar pelo killEnemy)
//   2. a caça dura no mínimo 3 s (não troca de alvo) e no máximo 6 s; depois de comer ou desistir, 5 s sem procurar
//   3. caçando, ignora o jogador até levar dano dele (e.hitT) ou até a caça acabar
//   4. alimentado (20 s: +10% de tamanho, −20% de velocidade, DNA ×1,6 se morto) não caça
//   5. predação conta pela metade na pressão populacional da 61

// Desempenho: cada predador procura a cada 0,25 s (fase própria, sem sorteio) e só dentro da tela + 300 px.

const PREY={enguia:['peixinho','plancton'],polvo:['eremita','peixinho'],tubarao:['peixinho','enguia','baiacu'],lanterna:['peixinho','cavalo'],rival:['eremita']};
const TEIA_STILL=3,TEIA_FAR=1.6/* medido: com 1× a pressão sobre o jogador caía 25–30% no Abissal e na Fossa */,TEIA_R=220,TEIA_MIN=3,TEIA_MAX=6,TEIA_CD=5,TEIA_FED=20,TEIA_SCAN=.25,TEIA_MARGIN=300;
const teiaOn=()=>!!(ECO.teia&&run);
let TV=null; // retângulo visível + margem, recalculado a cada quadro em teiaFrame
function teiaFrame(){if(!teiaOn()){TV=null;return;}const v=view(),m=TEIA_MARGIN;TV={x0:v.x0-m,x1:v.x1+m,y0:v.y0-m,y1:v.y1+m};}
const teiaIn=e=>TV&&e.x>TV.x0&&e.x<TV.x1&&e.y>TV.y0&&e.y<TV.y1;
// chamada no laço de inimigos antes do comportamento padrão; true = está caçando (vetor em TF)
function teiaHunt(e,dt,dPlayer){
 if(!TV||e.boss||e.elite||e.alfa||e.nest||!PREY[e.k])return false;
 if(e.fed>0)return false; // regra 4
 if(e.huntCd>0)e.huntCd-=dt;
 let q=e.hunt;
 if(q){e.huntT+=dt;
  const stop=q.dead||e.huntT>=TEIA_MAX||(time-(e.hitT==null?-9:e.hitT)<.1&&e.huntT>0)||!teiaIn(e);
  if(stop){teiaEnd(e,q.dead?'perdeu':e.huntT>=TEIA_MAX?'cansou':!teiaIn(e)?'fora':'jogador');return false;}
  const dx=q.x-e.x,dy=q.y-e.y,d=Math.hypot(dx,dy)||1;
  if(d<e.r+q.r*.6){teiaEat(e,q);return false;}
  if(d>TEIA_R*1.8&&e.huntT>=TEIA_MIN){teiaEnd(e,'longe');return false;}
  TF.x=dx/d;TF.y=dy/d;return true;}
 if(e.huntCd>0||!teiaIn(e))return false;
 if((P.stayT||0)>=TEIA_STILL)return false; // jogador parado (no mesmo lugar há 3 s): o mar não se distrai (medido: sem isso a pressão no parado caía ~25%)
 if(dPlayer<K_aggro(e)*TEIA_FAR)return false; // perto do jogador (até 1,6× o alcance de perseguição): não caça
 e.hsT=(e.hsT==null?(e.t%TEIA_SCAN):e.hsT)-dt;if(e.hsT>0)return false;e.hsT=TEIA_SCAN;

}

function teiaEat(e,q){

 for(let i=0;i<8;i++)parts.push({x:q.x,y:q.y,vx:rand(-90,90),vy:rand(-90,90),life:.4,col:'bub',r:rand(2,4)});
 if(!lowQ&&fx.length<40)fx.push({t:'ring',x:q.x,y:q.y,r:e.r*1.4,life:.3,max:.3,col:'255,170,120'});
 e.fed=TEIA_FED;e.r*=1.1;e.baseR=e.r;e.spd*=.8;e.xp*=1.6;e.sq=1;

function teiaFlee(e){

 const dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy)||1;if(d>TEIA_R*1.2)return false;TF.x=dx/d;TF.y=dy/d;return true;

function drawTeia(){

   ctx.strokeStyle=HC?'#ffffff':'rgba(255,170,120,.9)';ctx.lineWidth=HC?3.5:2.5;for(const s of [-1,0,1]){const b=a+s*.35,r0=e.r+6,r1=e.r+16;ctx.beginPath();ctx.moveTo(e.x+Math.cos(b)*r0,e.y+Math.sin(b)*r0);ctx.lineTo(e.x+Math.cos(b)*r1,e.y+Math.sin(b)*r1);ctx.stroke();}}

/* ================= Evento Disputa ================= */

// (RNG.ev, o de sempre) com ECO.teia ligado; desligado, a tabela de pesos é a de antes.
// Dois predadores alfa brigam por uma carcaça. Os dois se ferem (DISP_HURT da vida por segundo). O que cai sai sem DNA
// (como a presa da teia) e o vencedor fica ALIMENTADO (regra da 68: DNA ×1,6) e enfraquecido.
// Escolha do jogador: esperar e derrotar o vencedor, ou intervir cedo (ferir um dos dois) e enfrentar os dois: ao levar
// dano seu, os dois largam a briga e vêm atrás de você.

// com chefe vivo, e o chefe que nasce encerra o evento). Respeita o teto de inimigos.
// Telemetria em run.stat[b].disp: esperou (derrotou o vencedor depois da briga), interveio (feriu um dos dois durante a
// briga) ou ignorou (nenhum dos dois; fica null na partida e o relatório conta como ignorou).
EVENTS.disputa={ic:'⚔️',n:'Disputa',col:'#ffb08a',w:1};
const DISP_BIO=[null,['enguia','enguia'],['polvo','rival'],['lanterna','tubarao'],['rival','tubarao']];

 if(enemies.length>=bioQ(BIO_QCAP)+6){run.ev=null;return;}
 L.forEach((k,i)=>{const e=makeEnemy(k,ev.x+(i?70:-70),ev.y,false);e.r*=1.25;e.baseR=e.r;e.hp=e.max=e.max*2.2;e.xp*=3;e.dmg*=1.2;e.noEat=true;e.duel=ev;e.cd=99;ev.a.push(e);});
 run.ev=ev;banner={txt:'⚔️ DISPUTA! Dois predadores brigam pela carcaça: espere o vencedor ou entre na briga.',t:3.2,big:1};snd(90,.8,'sawtooth',.05,40,'event');
 const b=statB();if(b)(b.disp||(b.disp=[])).push({r:null});
}
const dispStat=()=>{const b=statB();return b&&b.disp&&b.disp[b.disp.length-1];};
// laço de inimigos: true = o duelista se move pelo vetor em TF (rodeia o rival)
function dispMove(e,dt){

 if(time-(e.hitT==null?-9:e.hitT)<.1){dispBreak(ev,'interveio');return false;} // levou dano seu: entra na briga com você
 const o=ev.a.find(q=>q!==e);if(!o||o.dead)return false;
 const dx=o.x-e.x,dy=o.y-e.y,d=Math.hypot(dx,dy)||1,cx=ev.x-e.x,cy=ev.y-e.y,cd=Math.hypot(cx,cy)||1;

/* ================= Exúvia-Eco ================= */
// [etapa-70] Laboratório de mecânicas, ideia C. Chave ECO.exuvia. Sem mutação nova: a Muda Chamariz (especial da 56) ganha
// um comportamento. Enquanto a Muda está num espaço de especial, grava-se a posição a cada 50 ms nos últimos 6 s (buffer
// circular de 120 pontos) e cada golpe com o ângulo. Ao usar a Muda, a casca nasce no ponto mais antigo e REFAZ o trajeto e
// os golpes, por trás da horda que te seguia, e continua atraindo inimigos como o chamariz de sempre (P.decoy).
// Dano do eco = 60% × min(1, deslocamento nos 6 s / 600 px) do dano do golpe; abaixo de 100 px, zero: parado = eco sem dano.
// Sem efeitos de partes.
// Fonte DSRC='eco': não é dano automático para a Rainha Vermelha (66) nem comida para a Dieta (67).
// Repetição ACELERADA: os 6 s gravados são refeitos em ECO_DUR = 4 s (o chamariz de antes durava 3,5 s). Com os 6 s inteiros,
// a casca ficaria 2,5 s a mais em campo que o chamariz da 56 (escolha a confirmar no playtest).
const ECO_MIN=100/* zona morta: o empurrão do próprio golpe move uns 40 px; parado continua sem dano */,ECO_N=120,ECO_DT=.05,ECO_WIN=6,ECO_DUR=4,ECO_K=.6,ECO_FULL=600;
const exuOn=()=>!!(ECO.exuvia&&P&&typeof spOn==='function'&&spOn('muda'));
function exuRec(dt){
 if(!exuOn()){if(P.exu)P.exu=null;return;}
 const o=P.exu||(P.exu={xs:new Float32Array(ECO_N),ys:new Float32Array(ECO_N),i:0,n:0,acc:ECO_DT,hits:[]});
 o.acc+=dt;while(o.acc>=ECO_DT){o.acc-=ECO_DT;o.xs[o.i]=P.x;o.ys[o.i]=P.y;o.i=(o.i+1)%ECO_N;if(o.n<ECO_N)o.n++;}
 while(o.hits.length&&time-o.hits[0].t>ECO_WIN)o.hits.shift();
}
// doAttack: grava o golpe
function exuHit(a){const o=P.exu;if(!o||!exuOn())return;o.hits.push({t:time,a});if(o.hits.length>60)o.hits.shift();}
// trajeto gravado, do mais antigo ao mais novo, e a distância percorrida
function exuPath(){const o=P.exu;if(!o||o.n<2)return null;const pts=[];let d=0;
 for(let j=0;j<o.n;j++){const k=(o.i-o.n+j+ECO_N)%ECO_N,x=o.xs[k],y=o.ys[k];if(pts.length){const p=pts[pts.length-1];d+=Math.hypot(x-p.x,y-p.y);}pts.push({x,y});}
 return {pts,d,t0:time-o.n*ECO_DT};}
// uso da Muda: o chamariz vira eco (devolve false se não há trajeto: segue o chamariz da 56)
function exuStart(){
 if(!exuOn())return false;const w=exuPath();if(!w)return false;
 const k=w.d<ECO_MIN?0:ECO_K*Math.min(1,w.d/ECO_FULL),p0=w.pts[0];
 P.decoy={x:p0.x,y:p0.y,ang:P.ang,t:ECO_DUR,n:0,eco:{pts:w.pts,hits:P.exu.hits.filter(h=>h.t>=w.t0).map(h=>({u:(h.t-w.t0)/(w.pts.length*ECO_DT),a:h.a})),k,d:w.d,hi:0}};
 if(fx.length<40)fx.push({t:'ring',x:p0.x,y:p0.y,r:ps.r*2.2,life:.3,max:.3,col:'255,255,255'});snd(260,.18,'triangle',.04,-120,'decoy');
 const b=statB();if(b){b.exN=(b.exN||0)+1;b.exD=(b.exD||0)+w.d;b.exK=(b.exK||0)+k;}
 return true;
}
// a cada quadro (junto do tempo do chamariz): anda pelo trajeto e repete os golpes
function exuStep(d,dt){
 const e=d.eco,u=Math.min(1,1-d.t/ECO_DUR),f=u*(e.pts.length-1),i=Math.min(e.pts.length-2,Math.floor(f)),r=f-i,a=e.pts[i],b=e.pts[i+1];
 const nx=a.x+(b.x-a.x)*r,ny=a.y+(b.y-a.y)*r;if(Math.hypot(nx-d.x,ny-d.y)>1)d.ang=Math.atan2(ny-d.y,nx-d.x);d.x=nx;d.y=ny;
 while(e.hi<e.hits.length&&e.hits[e.hi].u<=u){const h=e.hits[e.hi++];exuSwing(d,h.a,e.k);}
}
function exuSwing(d,a,k){
 if(SETTINGS.allyFx!=='minimo'&&fx.length<40)fx.push({t:'swoosh',x:d.x,y:d.y,a,r:ps.range,life:.2,max:.2,eco:1});
 if(!(k>0))return; // parado: eco sem dano

 for(const e of enemies){if(e.dead||e.under||e.k==='plancton')continue;const dx=e.x-d.x,dy=e.y-d.y,dd=Math.hypot(dx,dy);if(dd>ps.range+e.r)continue;if(Math.abs(angDiff(Math.atan2(dy,dx),a))>1.15)continue;damageEnemy(e,ps.dmg*k,Math.atan2(dy,dx),true);n++;}

// contorno da casca do eco (desenhado por cima da casca do chamariz)
function exuDraw(d){
 if(!d.eco)return;const T=RM?0:time;ctx.save();ctx.translate(d.x,d.y);ctx.setLineDash(RM?[]:[6,6]);ctx.lineDashOffset=-T*20;
 ctx.strokeStyle=HC?'#ffffff':`rgba(230,245,255,${.5+(d.eco.k>0?.3:0)})`;ctx.lineWidth=HC?3:2;ctx.beginPath();ctx.arc(0,0,ps.r*1.35,0,TAU);ctx.stroke();ctx.setLineDash([]);ctx.restore();
}

// [etapa-17] ===== assinaturas visuais das mutações (infraestrutura) · [etapa-18] assinaturas das mutações atuais =====
// Contrato de MUT_LOOK[id] = {z, alt?, st?(o,lv,s), draw?(o,lv,z)}:
//  • z/alt: zona de ancoragem — dorso (×2), borda, cauda, aura, boca (centro da frente, entre os braços; bloqueada pela Mandíbula)
//    e olhos (só troca a pupila: não desenha nada por cima). Nada cobre olhos nem arma.
//  • st = "selo" desenhado no dorso, centrado em 0 com unidade s (raio ≈ s). É também a versão de Célula/Larva (o.small):
//    toda assinatura tem um selo, e na Célula/Larva só os selos aparecem (máx. 2).
//  • draw = desenho nas outras zonas, no espaço do corpo já rotacionado/escalado (x para a frente). o = {r,t,c1,c2,atk,moving,bl,bw,tx,ty,small,hc,low}.
//    o.t vale 0 com reduzir movimento (desenho estático); animação ≤ 2 Hz; ≤ 6 paths (≤ 3 com o.low); sem shadowBlur/filter/gradiente novo;
//    com o.hc, contorno escuro; legível nos biomas escuros (traço claro com alfa ≥ .6); luz em lights só em bioma escuro.
const MUT_LOOK={};
const LOOK_CAP={dorso:2,borda:1,cauda:1,aura:1,boca:1,olhos:1},LOOK_LAYER={aura:'under',cauda:'over',dorso:'body',borda:'over',boca:'over',olhos:'flag'},LOOK_RANK={F:5,L:4,E:3,R:2,C:1};
const LOOK_O={r:0,t:0,c1:'',c2:'',atk:0,moving:false,bl:0,bw:0,tx:0,ty:0,small:false,hc:false,low:false}; // reaproveitado: zero alocação por quadro
const LOOK_DBG={k:0,saved:null}; // [etapa-18] modo de teste (só com ?debug=1): Ctrl+Shift+M liga todas as mutações; Ctrl+Shift+N alterna quais assinaturas aparecem
let eyeBar=false; // [etapa-23] Olhos-Fantasma: pupila horizontal
let eyeSlit=false; // [etapa-18] Olhos Pedunculados: pupila em fenda (lida por eye())
// Seleção das assinaturas visíveis. Só roda quando P.looksDirty (mutação, parte, evolução, qualidade): nunca a cada quadro.
function pickLooks(){
 const L={under:[],body:[],over:[],flag:{},dn:0,lift:false,key:''};P.looks=L;P.looksDirty=false;
 const small=P.stage<2,max=small?2:lowQ?3:4,used={dorso:0,borda:0,cauda:0,aura:0,boca:0,olhos:0};
 if(!small&&P.parts.patas&&P.parts.patas.id==='cauda')used.cauda=9; // a parte Cauda ocupa a zona
 if(P.parts.cabeca&&P.parts.cabeca.id==='mandibula')used.boca=9; // [etapa-18] a Mandíbula ocupa a boca
 L.lift=!small&&!!(P.parts.corpo&&P.parts.corpo.id==='concha'); // [etapa-18] a concha cobre o dorso: os selos sobem para a camada de cima
 const gone={};for(const m of MUTS)if(m.r==='F'&&P.mut[m.id])for(const s of m.fusion)gone[s]=1; // a fusão substitui as origens
 const c=MUTS.filter(m=>P.mut[m.id]&&MUT_LOOK[m.id]&&!gone[m.id]);
 c.sort((a,b)=>LOOK_RANK[b.r]-LOOK_RANK[a.r]||P.mut[b.id]-P.mut[a.id]||((P.mutAt&&P.mutAt[b.id])||0)-((P.mutAt&&P.mutAt[a.id])||0));
 if(LOOK_DBG.k&&c.length)c.push(...c.splice(0,LOOK_DBG.k%c.length)); // [etapa-18] só no modo de teste
 let n=0;
 for(const m of c){if(n>=max)break;const lk=MUT_LOOK[m.id];
  for(const z of small?(lk.z==='olhos'?['olhos']:['dorso']):[lk.z,lk.alt]){if(!z||used[z]>=LOOK_CAP[z])continue;
   const ly=LOOK_LAYER[z];if(ly==='flag')L.flag[m.id]=1;else L[ly].push({id:m.id,z,i:used[z]});used[z]++;n++;break;}}
 L.dn=used.dorso;L.key=c.map(m=>m.id).join(',');
}
function drawLooks(layer,o,bl,bw,tx,ty){
 if(!o.player||!P)return;if(P.looksDirty||!P.looks)pickLooks();const L=P.looks;
 const q=LOOK_O;q.r=o.r;q.t=RM?0:o.t;q.c1=o.c1;q.c2=o.c2;q.atk=o.atk;q.moving=o.moving;q.bl=bl;q.bw=bw;q.tx=tx==null?-bl*1.05:tx;q.ty=ty||0;q.small=P.stage<2;q.hc=HC;q.low=lowQ;
 if(layer==='body'&&L.lift)return;

}
function drawLookList(A,q){if(!A)return;
 for(let i=0;i<A.length;i++){const it=A[i],lk=MUT_LOOK[it.id],lv=P.mut[it.id]||1;ctx.save();
  try{if(it.z==='dorso'){const bl=q.bl,bw=q.bw,two=P.looks.dn>1,wide=bw>=bl*.85;let s,x=-bl*.12,y=0; // [etapa-18] 1 selo no centro; 2 lado a lado (corpo largo) ou em fila (corpo comprido)
     if(!two)s=Math.min(bl*.46,bw*.48);else if(wide){s=Math.min(bl*.42,bw*.3);y=(it.i?1:-1)*bw*.36;}else{s=Math.min(bw*.46,bl*.25);x=it.i?-bl*.52:-bl*.02;}
     ctx.translate(x,y);lk.st(q,lv,s);}else lk.draw(q,lv,it.z);}catch(e){}
  ctx.restore();}
}

const LK={hot:'#ff6a3d',gold:'#ffd166',green:'#5df08a',mint:'#9ff7c2',cyan:'#7ff0ff',red:'#ff3d5a',blue:'#8fd3ff',violet:'#c57bff',ink:'#1a1030',tox:'#a6ff4d',ash:'#9aa3ad',pink:'#ffb3c7',stone:'#e3e9ef',white:'#ffffff'};
const lkW=(o,f)=>o.t?Math.sin(o.t*TAU*f):0; // oscilação ≤ 2 Hz; parada com reduzir movimento
// contorno escuro sempre (legível sobre qualquer cor de corpo e nos biomas escuros); mais forte no alto contraste
function lkStroke(o,col,w){ctx.lineCap='round';ctx.lineJoin='round';const a=ctx.globalAlpha;ctx.strokeStyle=o.hc?'rgba(0,0,0,.9)':'rgba(10,15,25,.55)';ctx.lineWidth=w+(o.hc?3:2);ctx.stroke();ctx.globalAlpha=a;ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke();}
function lkFill(o,col){ctx.fillStyle=col;ctx.fill();ctx.strokeStyle=o.hc?'rgba(0,0,0,.9)':'rgba(10,15,25,.55)';ctx.lineWidth=o.hc?1.6:1.1;ctx.stroke();}
const lkEdge=(o,a,k=1)=>[Math.cos(a)*o.bl*k,Math.sin(a)*o.bw*k]; // ponto no contorno do corpo (a em rad; π = traseira)
const lkAura=o=>Math.max(o.bl,o.bw)*1.32;
function lkBolt(x,y,s,a){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.moveTo(-s*.2,-s);ctx.lineTo(s*.25,-s*.1);ctx.lineTo(-s*.1,0);ctx.lineTo(s*.2,s);ctx.restore();}
function lkDrop(x,y,s){ctx.moveTo(x,y-s);ctx.quadraticCurveTo(x+s*.9,y+s*.2,x,y+s*.8);ctx.quadraticCurveTo(x-s*.9,y+s*.2,x,y-s);}
// ---- assinaturas (etapa 18). Mutações que já tinham visual próprio ficam de fora: garras/pinca (pinças maiores), colosso (tamanho),
//      cardume (peixes em órbita), espinhos (espetos), casca (anel do escudo).

 ps=S();const dh=Math.max(0,ps.maxhp-P.max);P.max=ps.maxhp;P.hp=Math.min(P.max,P.hp+dh);
 if(id==='portuno')P.charges=Math.min(4,P.charges+1);
 snd(660,.2,'triangle',.06,400,'ui');banner={txt:SPECS[id].ic+' '+SPECS[id].title.toUpperCase()+'!',t:2.5,big:1};
 openUpgrade();
}
function partScreen(){
 setState('part');banner=null;
 if(!P.curP)P.curP=rollParts();
 const lvOf=id=>{for(const sl in P.parts){const q=P.parts[sl];if(q&&q.id===id)return q.lv;}return 0;};
 const html=P.curP.map((id,i)=>{const pt=PARTS[id],cur=P.parts[pt.slot],l=lvOf(id)+1;
  // [etapa-9] encaixe afetado destacado; substituição com ícone e forma de aviso, não só cor
  const note=l>1?`<div class="lv">⬆ Melhorar para ★${l}</div>`:cur?`<div class="pwarn" role="note">⚠ Substitui: ${icH(PARTS[cur.id].ic)} ${PARTS[cur.id].n}</div>`:`<div class="lv">✓ Encaixe livre!</div>`;
  return `<button class="card pcard" data-p="${id}" data-slotfor="${pt.slot}">${(codexSee('p',id),'')}<div class="rar">${icon(pt.slot)} ${SLOTS[pt.slot].n.toUpperCase()}</div><div class="ic">${partImg(id)?`<img class="pimg" src="${partImg(id)}" alt="" width="88" height="88">`:pt.ic}</div><div class="nm">${pt.n}</div><div style="font-size:13px;opacity:.75">${doAnimal(pt.from)}</div>${note}${setHint(id)}<div class="ds">${pt.d(l)}</div><div class="k">[${i+1}]</div></button>`;}).join('');
 show(choiceHTML(`<h2>🧩 Nova parte!</h2><div class="sub" style="margin:0">Escolha uma parte de animal para o seu mutante</div><div class="cards">${html||'<div class="sub">Todas as partes no máximo!</div>'}</div>
 ${html&&META.up.partReroll?`<div class="tools"><button class="tool" id="prr" ${P.partRerolls>0?'':'disabled'}>🎲 Sortear partes (${P.partRerolls})</button></div>`:''}
 ${html?'':'<br><button class="btn" id="sk">Continuar</button>'}`)); // [etapa-30] Mais Partes
 // [etapa-2]
 if(!html)$('#sk').onclick=finishPartChoice;
 {const b=$('#prr');if(b)b.onclick=()=>{if(P.partRerolls<=0)return;P.partRerolls--;P.curP=rollParts();snd(500,.1,'square',.03,300,'ui');openUpgrade();};} // [etapa-30]
 ov.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>applyPart(b.dataset.p));
 wireSlotHighlight();
}
function renderCards(){
 tip('card'); // [etapa-11]
 if(!(P.cur&&P.cur.length))P.cur=rollCont(META.up.cards4?4:3);/* [etapa-64] nunca uma tela vazia */const pick=P.cur;
 const html=pick.map((m,i)=>{if(m.cont)return contCardHTML(m,i);/* [etapa-64] */if(m.cv)return cvCardHTML(m,i);/* [etapa-66] */const l=(P.mut[m.id]||0)+1;let pips='';for(let j=1;j<=m.max;j++)pips+=`<i class="${j<l?'on':j===l?'nx':''}"></i>`;
  const sub=m.r==='F'?m.fusion.map(id=>icH(MUTS.find(x=>x.id===id).ic)).join(' + '):(l===1?'NOVA MUTAÇÃO':'Nível '+l+' / '+m.max);
  // [etapa-9] "antes → depois" em aumentos de nível; etiquetas DASH e FUSÃO; forma da borda por raridade
  const delta=l>1&&MUT_TOTAL[m.id]?`<div class="delta"><span>${MUT_TOTAL[m.id](l-1)}</span> → <b>${MUT_TOTAL[m.id](l)}</b></div>`:`<div class="ds">${m.d(l)}</div>`;
  return `<button class="card mcard r-${m.r} ${P.banMode?'ban':''}" data-id="${m.id}">${(codexSee('m',m.id),'')}<div class="rar">${icon('r'+m.r)} ${RAR[m.r].n}</div><div class="ic">${icH(m.ic)}</div><div class="nm">${m.n}</div><div class="lv">${sub}</div>${m.max>1?`<div class="pips">${pips}</div>`:''}${delta}${m.dash?'<div class="ctag">💨 DASH</div>':''}${spCardTag(m)/* [etapa-56] */}${needHint(m)}${fusionHint(m)}<div class="k">[${i+1}]</div></button>`;}).join(''); // [etapa-64] o Banquete saiu (cartas contínuas)
 const tot=P.batchTot||pending,idx=Math.max(1,tot-pending+1);
 show(choiceHTML(`<h2>${P.banMode?'🚫 Banir qual?':'Mutação!'}</h2><div class="sub" style="margin:0">${P.banMode?'A mutação banida não aparece mais nesta partida':(tot>1?`<b>Mutação ${idx} de ${tot}</b> · `:'')+(P.curRare?'💎 Recompensa da descida: só raras ou melhores'/* [etapa-58] */:'Nível '+(P.level-pending+1)+' — escolha uma mutação')}</div><div class="cards">${html}</div>
 <div class="tools"><button class="tool" id="rr" ${P.rerolls>0&&!P.banMode?'':'disabled'}>🎲 Sortear de novo (${P.rerolls}) [R]</button><button class="tool ${P.banMode?'on':''}" id="bn" ${P.bans>0&&pick.length?'':'disabled'}>🚫 ${P.banMode?'Cancelar':'Banir'} (${P.bans}) [B]</button></div>`));
 // [etapa-2]
 $('#rr').onclick=rerollCards;
 $('#bn').onclick=toggleBanMode;
 ov.querySelectorAll('.card').forEach(b=>b.onclick=()=>{
  const id=b.dataset.id;
  if(P.banMode){banMutation(id);return;}
  if(CONT_BY[id])applyCont(id);/* [etapa-64] */else if(cvIsCard(id))cvTake(id);/* [etapa-66] */else{const nd=spNeed(id);if(Array.isArray(nd)&&nd.length>1)spReplaceScreen(id);else applyMutation(id);} // [etapa-56] 2 especiais cheios: escolher qual sai
 });
}
function awardPearls(){
 const d=[1,1.5,2.2][run.diff];
 const parts2=[['Criaturas',P.kills*.1],['Elites',P.elites*1],['Chefes',P.bossK*12],['Biomas concluídos',(run.cleared||0)*15],['Tempo',mins()*2],['Descidas',run.rotaP||0]/* [etapa-58] */,['Correntes',run.mode==='inf'?Math.max(0,infM().m-10)*2:0]/* [etapa-63] Infinito longo: +2 por minuto depois dos 10 (provisório, a 64 calibra) */];
 const mb=run.mods?modBonus(run.mods):0; // [etapa-31] bônus dos modificadores (teto de +100%)
 const total=Math.floor(parts2.reduce((a,b)=>a+b[1],0)*d*(1+mb));
 const delta=Math.max(0,total-(run.paid||0));run.paid=total;META.pearls+=delta;saveMeta();
 return `<div class="sub"><span class="pearl" style="font-size:22px">+${delta} ⚪ pérolas</span><br><span style="font-size:13px;opacity:.7">${parts2.filter(p=>p[1]>=1).map(p=>p[0]+' '+Math.floor(p[1])).join(' · ')}${d>1?' · dificuldade x'+d:''}${mb?' · modificadores x'+(1+mb).toFixed(2).replace('.',','):''} · total: ${META.pearls}</span></div>`;
}
/* [etapa-63] recorde de tempo no Infinito (qualquer dificuldade, sem modificadores) que abre as camadas da Profundidade */
function infRecord(){const L0=infLayer();if(run.mode!=='inf'||Object.keys(run.mods||{}).length)return {L0,L1:L0};const t=infM().m*60;if(t>(META.infBest||0)){META.infBest=t;saveMeta();}return {L0,L1:infLayer()};}
function labPathHTML(r){ // linha da derrota no Infinito: camada aberta agora, melhoria de Profundidade ao alcance, próxima camada
 if(!r||run.mode!=='inf')return '';const out=[];
 for(let i=r.L0;i<r.L1;i++){const nm=UPGRADES.filter(u=>u.lay).flatMap(u=>u.lay.map((y,j)=>y===i+1?u.n+' '+ROMAN[j]:null)).filter(Boolean);out.push(`<b style="color:#ffd166">🔓 Camada ${i+1} do Laboratório aberta</b>${nm.length?': '+nm.join(', '):''}`);}
 const av=UPGRADES.filter(u=>u.lay&&(META.up[u.id]||0)<u.max&&!upLock(u,META.up[u.id]||0)).map(u=>({u,l:META.up[u.id]||0,c:u.cost[META.up[u.id]||0]})).sort((a,b)=>a.c-b.c)[0];
 if(av)out.push(`🧪 ${av.u.n} ${ROMAN[av.l]}: <span class="pearl">⚪ ${av.c}</span>, ${META.pearls>=av.c?'você tem '+META.pearls:'faltam '+(av.c-META.pearls)}`);
 const L=infLayer();if(L<LAYERS.length)out.push(`🔒 Próxima camada aos ${LAYERS[L]} min no Infinito (seu recorde: ${Math.floor((META.infBest||0)/60)} min)`);
 return out.length?`<div class="sub labpath" style="font-size:15px">${out.join('<br>')}</div>`:'';}
function partsIcons(){return Object.keys(SLOTS).map(sl=>P.parts[sl]?icH(PARTS[P.parts[sl].id].ic)+(P.parts[sl].lv>1?'<sup style="font-size:.45em;color:#ffd166">★'+P.parts[sl].lv+'</sup>':''):'<span style="opacity:.4">'+icon(sl)+'</span>').join(' ');} // [etapa-17] encaixe vazio com o ícone próprio (o emoji 🛡️/🦵/👁️ repetia itens)
function statsHTML(){return `<div class="stats"><span>Modo</span><span>${run.mode==='camp'?'Campanha':'Infinito'} · ${DIFFS[run.diff].ic} ${DIFFS[run.diff].name}</span><span>Mutante</span><span>${mutantName()}${P.asc?' ★'+P.asc:''}</span><span>Partes</span><span>${partsIcons()}</span><span>Bioma</span><span>${BIOMES[run.biome].ic} ${BIOMES[run.biome].name}</span>${cndOn()?`<span>Condição</span><span title="${COND_BY[run.cnd.id].f}">${COND_BY[run.cnd.id].ic} ${COND_BY[run.cnd.id].n}</span>`:''/* [etapa-57] */}${run.mode==='camp'&&run.route&&run.route.length?`<span>Descidas</span><span>${routeTxt()}</span>`:''/* [etapa-58] */}<span>Nível</span><span>${P.level}</span><span>Tempo</span><span>${fmt(time)}</span><span>Criaturas derrotadas</span><span>${P.kills} (${P.elites} elites)</span><span>Chefes derrotados</span><span>${P.bossK}</span><span>Engolidas inteiras</span><span>${P.eaten}</span><span>Sessão</span><span>${sessionMin()} min</span></div>`;} // [etapa-10]
function gameOver(){
 if(state!=='play')return;
 finishTutorial(); // [etapa-11]
 setState('over');snd(200,.8,'sawtooth',.06,-160,'uiRaw');
 let rec='';
 if(run.daily){if(time>dailyBest()){DAILY.d=todaySeed();DAILY.best=time;store.set('carc_daily',JSON.stringify(DAILY));rec='<div class="sub" style="color:#ffd166">🎯 Novo recorde do desafio de hoje!</div>';}} // [etapa-31] recorde próprio (não mexe no do Infinito)
 else if(run.mode==='inf'&&!Object.keys(run.mods||{}).length){const k='carc2_inf_'+run.diff,prev=+(store.get(k)||0);if(time>prev){store.set(k,String(time));rec='<div class="sub" style="color:#ffd166">🏆 Novo recorde no Infinito!</div>';}}
 const lr=infRecord();/* [etapa-63] */const pr=awardPearls();
 // [etapa-1] S7 a tela atrasada só abre se ainda for este mesmo game over
 const runRef=run;
 setTimeout(()=>{if(state!=='over'||run!==runRef)return;// [etapa-10] tom encorajador; mostra o que melhorou; três botões com o mesmo peso visual; sem contagem regressiva nem auto-início
 show(`<h2>A evolução continua</h2><div class="sub">Você foi devorado desta vez — mas seu DNA aprendeu algo.</div>${deathCauseHTML()}${rec}${pr}${labPathHTML(lr)/* [etapa-63] */}${nearAchHTML()}${breakBoxHTML()}${statsHTML()}<br>
 <div class="row"><button class="btn alt" id="again" data-autofocus>Jogar de novo</button><button class="btn alt" id="lb">🧪 Laboratório</button><button class="btn alt" id="mn">Menu</button></div>`);
 $('#again').onclick=()=>startRun(run.mode,run.diff,{daily:run.daily});$('#mn').onclick=menu;$('#lb').onclick=lab;wireBreakBox();},700); // [etapa-2/10]
}
function win(){
 const infNew=!infOpen();/* [etapa-51] primeira vitória destrava o Infinito */
 setState('win');finishTutorial();/* [etapa-11] */store.set('carc2_won','1');
 run.winT=-1; // [etapa-1] S7 winT exatamente 0 travava as cartas após "Continuar no Infinito"
 ach('carcinizacao');if(run.diff>=1)ach('dificil');if(run.diff>=2)ach('abissal');
 const k='carc2_camp_'+run.diff,prev=store.get(k);let nr=false;if(!prev||time<+prev){store.set(k,String(time));nr=true;}
 snd(523,.2,'triangle',.06,0,'ui');setTimeout(()=>snd(659,.2,'triangle',.06,0,'ui'),180);setTimeout(()=>snd(784,.4,'triangle',.06,0,'ui'),360);
 const pr=awardPearls();
 show(`<h1 style="font-size:clamp(36px,7vw,70px)">CARCINIZAÇÃO<br>COMPLETA</h1><div class="evo">${STAGES[P.stage].ic}</div>${mapHTML(5,-1)}<div class="sub">Você atravessou os 5 biomas e derrotou o Caranguejo Ancestral.${nr?'<br><b style="color:#ffd166">🏆 Novo recorde!</b>':''}${infNew?'<br><b class="infnew" role="status">♾️ Modo Infinito desbloqueado!</b>'/* [etapa-51] */:''}</div>
 ${pr}${nearAchHTML()}${breakBoxHTML()}${statsHTML()}<br>
 <div class="row"><button class="btn purple" id="inf" data-autofocus>♾️ Continuar no Infinito</button><button class="btn" id="again">Jogar de novo</button><button class="btn alt" id="mn">Menu</button></div>
 <div class="small">No Infinito, você mantém tudo o que conquistou e a dificuldade continua subindo até o fim.</div>`);
 // [etapa-2]
 $('#inf').onclick=continueInfinite;wireBreakBox(); // [etapa-10]
 $('#again').onclick=()=>startRun(run.mode,run.diff,{daily:run.daily});$('#mn').onclick=menu;
}


/* ================= Loop ================= */
let last=performance.now();
// [etapa-1] B2 qualidade adaptativa: mede o tempo de TRABALHO do quadro (update+render), não o intervalo do rAF,
// com histerese em segundos e espera crescente para subir de novo (evita oscilar).
let quality='auto'; // 'auto' | 'alta' | 'baixa' — será exposto nas Opções (Prompt 3)
const QA={ema:8,over:0,under:0,upWait:5};
function setLowQ(v){if(lowQ===v)return;lowQ=v;if(P)P.looksDirty=true;/* [etapa-17] */_gc.clear();resize();} // resize() só realoca o canvas se o tamanho/DPR mudar
function setQuality(q){quality=q==='alta'||q==='baixa'?q:'auto';QA.over=QA.under=0;if(quality==='alta')setLowQ(false);else if(quality==='baixa')setLowQ(true);}
function adaptQuality(work,el){
 if(quality!=='auto'){return;}
 QA.ema+=(work-QA.ema)*Math.min(1,el*4); // ~0,25 s de suavização
 if(!lowQ){if(QA.ema>20){QA.over+=el;if(QA.over>2){setLowQ(true);QA.over=0;QA.under=0;}}else QA.over=0;}
 else{if(QA.ema<12){QA.under+=el;if(QA.under>QA.upWait){setLowQ(false);QA.under=0;QA.over=0;QA.upWait=Math.min(60,QA.upWait*2);}}else QA.under=0;}
}
function loop(now){
 const raw=now-last,dt=clamp(raw/1000,0,.033);last=now; // [etapa-1] S7 dt nunca negativo
 const t0=performance.now();
 frameNo++;if(hsCool>0)hsCool-=dt; // [etapa-4]
 pollPad(dt); // [etapa-6]
 if(state==='play'){if(hitstop>0)hitstop-=dt;else if(PERF.on){const tu=performance.now();update(dt);PERF.upd=PERF.upd*.9+(performance.now()-tu)*.1;}else update(dt);} // [etapa-12]
 if(PERF.on&&raw>0)PERF.fps=PERF.fps*.9+1000/raw*.1;
 else if(state==='menu'||(state==='settings'&&settingsFrom==='menu'))time+=dt; // [etapa-3]
 if(toasts.length){toasts[0].t-=dt;if(toasts[0].t<=0)toasts.shift();}
 updateAmbient(dt); // [etapa-1] A4
 updateTips(dt); // [etapa-11]
 render();perfPanel(); // [etapa-12]
 if(state==='play'&&raw>0&&raw<200)adaptQuality(performance.now()-t0,raw/1000); // [etapa-1] B2/S7 ignora intervalos <= 0
 requestAnimationFrame(loop);
}
applySettings(); // [etapa-2/3] qualidade, reduzir movimento e ataque automático vêm das configurações
newGame('camp',0);menu();
requestAnimationFrame(loop);
})();
