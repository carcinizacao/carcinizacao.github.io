<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><!-- [etapa-33] -->
<title>Carcinização — evolua até virar caranguejo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* [etapa-13] TOKENS — única fonte de cor, raio, espaçamento, sombra, tipografia e duração. Nenhuma cor literal fora daqui. */
  :root{
   /* cores (geradas a partir da paleta; variações "-aNN" = mesma cor com NN% de opacidade) */
   --bg-0:#04121f;
   --bg-1-a72:rgba(3,20,36,0.72);
   --bg-deep-a93:rgba(1,8,16,0.93);
   --bg-hc-a97:rgba(0,4,10,0.97);
   --black-a25:rgba(0,0,0,0.25);
   --black-a40:rgba(0,0,0,0.4);
   --black-a78:rgba(0,0,0,0.78);
   --blue-2-a45:rgba(160,200,255,0.45);
   --blue-a70:rgba(90,169,255,0.7);
   --blue-soft:#a9c8ff;
   --card-c-1-a95:rgba(25,70,95,0.95);
   --card-c-2-a95:rgba(8,30,48,0.95);
   --card-dash-1-a95:rgba(40,55,110,0.95);
   --card-dash-2-a95:rgba(12,20,50,0.95);
   --card-e-1-a95:rgba(70,35,120,0.95);
   --card-e-2-a95:rgba(25,10,50,0.95);
   --card-f-1-a97:rgba(90,20,70,0.97);
   --card-f-2-a97:rgba(20,10,45,0.97);
   --card-l-1-a95:rgba(120,80,15,0.95);
   --card-l-2-a95:rgba(45,25,5,0.95);
   --card-r-1-a95:rgba(25,60,120,0.95);
   --card-r-2-a95:rgba(8,22,55,0.95);
   --coral:#ff6a3d;
   --coral-deep:#8a2412;
   --coral-glow-a45:rgba(255,90,54,0.45);
   --coral-hi:#ffb26b;
   --coral-shadow:#9b3015;
   --cyan:#7ff0e6;
   --cyan-2:#3fd0c4;
   --cyan-3:#2fb8ac;
   --cyan-a12:rgba(127,240,230,0.12);
   --cyan-a35:rgba(127,240,230,0.35);
   --cyan-a50:rgba(127,240,230,0.5);
   --cyan-hi:#a9fff5;
   --cyan-shadow:#127a72;
   --cyan-soft:#b9f5ee;
   --gold:#ffd166;
   --gold-a12:rgba(255,209,102,0.12);
   --gold-a16:rgba(255,209,102,0.16);
   --gold-a18:rgba(255,209,102,0.18);
   --gold-a25:rgba(255,209,102,0.25);
   --gold-a30:rgba(255,209,102,0.3);
   --gold-a45:rgba(255,209,102,0.45);
   --gold-a50:rgba(255,209,102,0.5);
   --gold-a60:rgba(255,209,102,0.6);
   --gold-shadow:#8a5a00;
   --green:#5df08a;
   --green-a12:rgba(93,240,138,0.12);
   --green-a50:rgba(93,240,138,0.5);
   --green-a8:rgba(93,240,138,0.08);
   --ink:#eafcff;
   --ink-2:#cfe7ee;
   --ink-3:#b9d3dc;
   --line-hc:#e8f6ff;
   --on-coral:#2a0d04;
   --on-cyan:#032a28;
   --on-green:#003322;
   --on-pearl:#3a2300;
   --on-violet:#1d0b45;
   --pearl:#ffe7b0;
   --pearl-2:#f2b84b;
   --pink:#ff6fd8;
   --rar-c:#9fe9e1;
   --rar-e:#cfb3ff;
   --rar-f:#ffb3ec;
   --rar-r:#8cc4ff;
   --red:#ff5d5d;
   --red-a14:rgba(255,93,93,0.14);
   --red-a18:rgba(255,93,93,0.18);
   --red-a40:rgba(255,93,93,0.4);
   --red-pale:#ffd0d0;
   --red-soft:#ff9b9b;
   --red-soft-2:#ff8a8a;
   --surface-2-a95:rgba(6,30,44,0.95);
   --surface-3:#123a52;
   --surface-4:#0b2a3e;
   --surface-a75:rgba(3,18,32,0.75);
   --surface-a80:rgba(3,18,32,0.8);
   --surface-hc:#03111c;
   --violet:#9b6bff;
   --violet-2-a25:rgba(179,136,255,0.25);
   --violet-2-a80:rgba(179,136,255,0.8);
   --violet-hi:#d9c2ff;
   --violet-shadow:#4b2a99;
   --white:#ffffff;
   --white-a10:rgba(255,255,255,0.1);
   --white-a12:rgba(255,255,255,0.12);
   --white-a14:rgba(255,255,255,0.14);
   --white-a15:rgba(255,255,255,0.15);
   --white-a16:rgba(255,255,255,0.16);
   --white-a18:rgba(255,255,255,0.18);
   --white-a20:rgba(255,255,255,0.2);
   --white-a22:rgba(255,255,255,0.22);
   --white-a25:rgba(255,255,255,0.25);
   --white-a30:rgba(255,255,255,0.3);
   --white-a35:rgba(255,255,255,0.35);
   --white-a5:rgba(255,255,255,0.05);
   --white-a50:rgba(255,255,255,0.5);
   --white-a6:rgba(255,255,255,0.06);
   --white-a8:rgba(255,255,255,0.08);
   /* cores usadas só pelo canvas (HUD) — lidas pelo objeto THEME */
   --orange:#ff9b5d;--pink-2:#ff5d8a;--lime:#a6ff4d;--violet-2:#b388ff;
   /* raios, espaços, sombras */
   --r-s:10px;--r-m:16px;--r-l:20px;--r-pill:999px;
   --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;
   --sh-1:0 6px 14px var(--black-a40);--sh-2:0 12px 24px var(--black-a40);
   /* tipografia: Baloo 2 só em títulos e números grandes; texto corrido e interface em fonte do sistema */
   --font-display:'Baloo 2',system-ui,sans-serif;--font-ui:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
   /* durações */
   --dur-fast:.12s;--dur-med:.2s;--dur-slow:.35s;
   /* estados */
   --st-available:var(--cyan);--st-selected:var(--gold);--st-done:var(--green);--st-critical:var(--red);--st-locked-opacity:.45;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-0);font-family:var(--font-ui);color:var(--ink);user-select:none;-webkit-user-select:none}
  /* [etapa-7] touch-action:none só no canvas (menus aceitam zoom do navegador); áreas seguras via variáveis */
  :root{--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px)}
  canvas{display:block;position:fixed;inset:0;touch-action:none}
  #ov button{touch-action:manipulation}
  #ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,var(--bg-1-a72),var(--bg-deep-a93));z-index:5;padding:max(20px,var(--sat)) max(20px,var(--sar)) max(20px,var(--sab)) max(20px,var(--sal));overflow:auto}
  #ov.hide{display:none}
  .panel{max-width:900px;width:100%;text-align:center;animation:pop .35s ease;margin:auto}
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  h1,h2,h3,.card .nm,.btn,.chain{font-family:var(--font-display)} /* [etapa-13] Baloo 2 só em títulos, nomes de carta e chamadas principais */
  h1{font-size:clamp(44px,9vw,92px);line-height:.9;font-weight:800;letter-spacing:1px;color:var(--coral);text-shadow:0 5px 0 var(--coral-deep),0 10px 30px var(--coral-glow-a45)}
  h2{font-size:clamp(30px,6vw,54px);font-weight:800;color:var(--gold);text-shadow:0 4px 0 var(--gold-shadow);margin-bottom:6px}
  h3{font-size:15px;letter-spacing:2px;text-transform:uppercase;opacity:.6;margin:14px 0 8px;font-weight:800}
  .sub{font-size:clamp(16px,2.6vw,21px);opacity:.85;margin:10px 0 18px}
  .chain{font-size:clamp(24px,5vw,38px);margin:6px 0 10px;letter-spacing:4px}
  .ctrl{display:inline-grid;grid-template-columns:auto auto;gap:2px 16px;text-align:left;background:var(--white-a6);border:1px solid var(--white-a12);padding:12px 18px;border-radius:16px;font-size:15px}
  .ctrl b{color:var(--cyan)}
  .btn{font-weight:800;font-size:22px;padding:12px 38px;border-radius:999px;border:none;cursor:pointer;color:var(--on-coral);background:linear-gradient(var(--coral-hi),var(--coral));box-shadow:0 6px 0 var(--coral-shadow),0 12px 24px var(--black-a40);transition:transform .1s}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--coral-shadow)}
  .btn.alt{background:linear-gradient(var(--cyan-hi),var(--cyan-2));color:var(--on-cyan);box-shadow:0 6px 0 var(--cyan-shadow),0 12px 24px var(--black-a40)}
  .btn.purple{background:linear-gradient(var(--violet-hi),var(--violet));color:var(--on-violet);box-shadow:0 6px 0 var(--violet-shadow),0 12px 24px var(--black-a40)}
  .cards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  .card{font-family:inherit;color:var(--ink);width:205px;min-height:250px;padding:18px 16px;border-radius:20px;border:2px solid var(--cyan-a35);background:linear-gradient(160deg,var(--card-c-1-a95),var(--card-c-2-a95));cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .12s,border-color .12s,box-shadow .12s,opacity .2s;box-shadow:0 10px 30px var(--black-a40)}
  .card:hover,.card:focus{transform:translateY(-6px) rotate(-1deg);border-color:var(--gold);box-shadow:0 16px 40px var(--gold-a25);outline:none}
  .card.dash{border-color:var(--blue-2-a45);background:linear-gradient(160deg,var(--card-dash-1-a95),var(--card-dash-2-a95))}
  .card .ic{font-size:56px;line-height:1.1;filter:drop-shadow(0 4px 6px var(--black-a40))}
  .card .nm{font-size:22px;font-weight:800;line-height:1.1}
  .card .lv{font-size:14px;color:var(--gold);font-weight:700}
  .card .tag{font-size:12px;letter-spacing:1px;font-weight:800;color:var(--blue-soft)}
  .card .ds{font-size:16px;line-height:1.25}
  .card .k{margin-top:auto;font-size:13px;opacity:.8} /* [etapa-15] contraste ≥ 4,5:1 */
  .pips{display:flex;gap:4px}
  .pips i{width:12px;height:12px;border-radius:50%;background:var(--white-a18);display:block}
  .pips i.on{background:var(--gold)}
  .pips i.nx{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
  .stats{display:inline-grid;grid-template-columns:auto auto;gap:4px 24px;font-size:19px;margin:10px 0 22px;text-align:left}
  .stats span:nth-child(odd){opacity:.7}
  .stats span:nth-child(even){font-weight:800;color:var(--gold)}
  .small{font-size:13px;opacity:.55;margin-top:18px}
  .evo{font-size:clamp(70px,14vw,130px);margin:10px 0;animation:evoIn .6s ease-out} /* [etapa-9] entrada única ≤ 600 ms */
  @keyframes evoIn{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
  @keyframes wob{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.12) rotate(4deg)}}
  .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .opt{font-family:inherit;color:var(--ink);cursor:pointer;border-radius:16px;padding:10px 16px;min-width:150px;border:2px solid var(--white-a14);background:var(--white-a5);text-align:left;transition:all .12s}
  .opt:hover{border-color:var(--gold-a60)}
  .opt.on{border-color:var(--gold);background:var(--gold-a12);box-shadow:0 0 20px var(--gold-a18)}
  .opt b{font-size:18px;display:block}
  .opt span{font-size:13px;opacity:.75;display:block;line-height:1.2}
  .opt em{font-style:normal;font-size:12px;color:var(--cyan);display:block;margin-top:2px}
  .map{display:flex;align-items:center;justify-content:center;gap:0;margin:16px 0 8px;flex-wrap:nowrap}
  .node{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--white-a6);border:3px solid var(--white-a15);position:relative;flex:none}
  .node.done{border-color:var(--green);background:var(--green-a12)}
  .node.done:after{content:'✓';position:absolute;right:-4px;bottom:-4px;background:var(--green);color:var(--on-green);border-radius:50%;width:22px;height:22px;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .node.next{border-color:var(--gold);box-shadow:0 0 24px var(--gold-a50);animation:wob 1.6s ease-in-out infinite}
  .link{width:34px;height:4px;background:var(--white-a15);flex:none}
  .link.done{background:var(--green)}
  .info{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px auto 18px;max-width:760px;text-align:left}
  .info div{background:var(--white-a5);border:1px solid var(--white-a10);border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.3}
  .info b{color:var(--gold);font-size:15px}
  .card.r-R{border-color:var(--blue-a70);background:linear-gradient(160deg,var(--card-r-1-a95),var(--card-r-2-a95))}
  .card.r-E{border-color:var(--violet-2-a80);background:linear-gradient(160deg,var(--card-e-1-a95),var(--card-e-2-a95));box-shadow:0 0 24px var(--violet-2-a25)}
  .card.r-L{border-color:var(--gold);background:linear-gradient(160deg,var(--card-l-1-a95),var(--card-l-2-a95));animation:glow 1.4s ease-in-out infinite}
  .card.r-F{border:2px solid transparent;background:linear-gradient(160deg,var(--card-f-1-a97),var(--card-f-2-a97)) padding-box,linear-gradient(120deg,var(--pink),var(--gold),var(--cyan)) border-box;animation:glow 1s ease-in-out infinite}
  @keyframes glow{0%,100%{box-shadow:0 0 14px var(--gold-a30)}50%{box-shadow:0 0 34px var(--gold-a60)}}
  .rar{font-size:12px;letter-spacing:2px;font-weight:800;padding:1px 10px;border-radius:999px;background:var(--black-a40)} /* [etapa-15] fundo escuro: rótulo ≥ 4,5:1 em todas as raridades */
  .r-C .rar{color:var(--rar-c)}.r-R .rar{color:var(--rar-r)}.r-E .rar{color:var(--rar-e)}.r-L .rar{color:var(--gold)}.r-F .rar{color:var(--rar-f)}
  .card.locked{opacity:.45;cursor:not-allowed;filter:grayscale(.6)}
  .card.ban{border-color:var(--red)!important;box-shadow:0 0 20px var(--red-a40)!important}
  .tools{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
  .tool{font-family:inherit;font-weight:800;font-size:15px;min-height:44px;/* [etapa-3] alvo de toque */padding:8px 18px;border-radius:999px;border:2px solid var(--white-a20);background:var(--white-a6);color:var(--ink);cursor:pointer}
  .tool:disabled{opacity:.35;cursor:not-allowed}
  .tool.on{border-color:var(--red);background:var(--red-a18)}
  .pearl{color:var(--pearl);font-weight:800}
  .shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;text-align:left;margin:10px 0 16px}
  .item{background:var(--white-a5);border:1px solid var(--white-a12);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center}
  .item .ic{font-size:30px;flex:none;width:40px;text-align:center}
  .item .tx{flex:1;font-size:13px;line-height:1.25;opacity:.9}
  .item .tx b{font-size:15px;display:block;opacity:1}
  .item button{font-family:inherit;font-weight:800;font-size:13px;padding:6px 10px;border-radius:999px;border:none;cursor:pointer;background:linear-gradient(var(--pearl),var(--pearl-2));color:var(--on-pearl);flex:none}
  .item button:disabled{background:var(--white-a12);color:var(--white-a50);cursor:not-allowed}
  .item.got{border-color:var(--green-a50);background:var(--green-a8)}
  .item.off{opacity:.55}
  .tabs{display:flex;gap:8px;justify-content:center;margin:10px 0}
  @media (max-width:560px){.node{width:46px;height:46px;font-size:24px}.link{width:14px}.opt{min-width:130px}}
  /* [etapa-3] foco visível (contorno 3 px, contraste alto) em todos os controles */
  #ov{touch-action:pan-x pan-y pinch-zoom} /* [etapa-7] */
  button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  /* [etapa-3] tela de Opções */
  .settings{max-width:760px;margin:0 auto;text-align:left;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px}
  .settings h2{text-align:center;font-family:var(--font-display)}
  .stabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0 14px}
  .stab{font:700 16px system-ui,sans-serif;min-height:44px;padding:8px 16px;border-radius:999px;border:2px solid var(--white-a22);background:var(--white-a6);color:var(--ink);cursor:pointer}
  .stab[aria-selected="true"]{background:var(--cyan);color:var(--on-cyan);border-color:var(--cyan)}
  .spanel{background:var(--surface-a75);border:1px solid var(--white-a14);border-radius:18px;padding:6px 18px}
  .srow{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;min-height:56px;padding:10px 0;border-bottom:1px solid var(--white-a8)}
  .srow:last-child{border-bottom:none}
  .srow .sl{flex:1 1 240px;min-width:0}
  .srow .sl label,.srow .sl .lb{font-weight:700;font-size:17px;display:block;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .srow .sh{display:block;font-size:16px;color:var(--ink-3);line-height:1.3;margin-top:2px}
  .srow output{font-weight:800;color:var(--gold);min-width:52px;text-align:right;font-size:17px}
  .srow .ctl{display:flex;align-items:center;gap:10px;flex:0 1 auto}
  .srow input[type=range]{width:200px;max-width:52vw;height:44px;accent-color:var(--cyan);cursor:pointer}
  .srow select{font:600 16px system-ui,sans-serif;min-height:44px;min-width:170px;padding:6px 10px;border-radius:12px;border:2px solid var(--white-a30);background:var(--surface-4);color:var(--ink);cursor:pointer}
  .srow input[type=checkbox]{appearance:none;-webkit-appearance:none;width:72px;height:44px;min-width:72px;min-height:44px;border-radius:999px;background:var(--white-a20);border:2px solid var(--white-a35);position:relative;cursor:pointer;flex:none;margin:5px 0}
  .srow input[type=checkbox]::after{content:'';position:absolute;top:3px;left:3px;width:34px;height:34px;border-radius:50%;background:var(--ink);transition:left .15s}
  .srow input[type=checkbox]:checked{background:var(--cyan-3);border-color:var(--cyan)}
  .srow input[type=checkbox]:checked::after{left:31px}
  .srow .soon{display:inline-block;font-size:16px;font-weight:700;color:var(--on-cyan);background:var(--gold);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle}
  .srow.disabled{opacity:.55}
  .sbtn{font:700 16px system-ui,sans-serif;min-height:44px;padding:8px 18px;border-radius:999px;border:2px solid var(--white-a30);background:var(--white-a8);color:var(--ink);cursor:pointer}
  .sbtn.warn{border-color:var(--red-soft-2);background:var(--red-a18)}
  .sfoot{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:16px}
  .sprev{display:inline-block;width:44px;height:44px;border-radius:10px;background:var(--surface-3);border:2px solid var(--white-a30)}
  .hint1{font:600 16px system-ui,sans-serif;color:var(--cyan-soft);margin:4px 0 2px}
  /* [etapa-9] tela de escolha com build ao lado; esmaecer suave (150 ms) */
  #ov:not(.hide){animation:fade .15s ease}
  body.reduce-motion #ov:not(.hide){animation:none}
  .panel.wide{max-width:1240px}
  .choice{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
  @media (min-width:1200px){.choice{grid-template-columns:minmax(0,1fr) 280px}
    /* [etapa-9-fix] build longo não estica a tela: lista rola por dentro e as cartas ficam centralizadas na vertical */
    .choice>.cmain{align-self:center}
    .choice>.build{max-height:calc(100vh - 48px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}}

//  • z/alt: zona de ancoragem — dorso (×2), borda, cauda, aura, boca (centro da frente, entre os braços; bloqueada pela Mandíbula)
//    e olhos (só troca a pupila: não desenha nada por cima). Nada cobre olhos nem arma.
//  • st = "selo" desenhado no dorso, centrado em 0 com unidade s (raio ≈ s). É também a versão de Célula/Larva (o.small):
//    toda assinatura tem um selo, e na Célula/Larva só os selos aparecem (máx. 2).

const MUT_LOOK={};

function pickLooks(){
 const L={under:[],body:[],over:[],flag:{},dn:0,lift:false,key:''};P.looks=L;P.looksDirty=false;
 const small=P.stage<2,max=small?2:lowQ?3:4,used={dorso:0,borda:0,cauda:0,aura:0,boca:0,olhos:0};
 if(!small&&P.parts.patas&&P.parts.patas.id==='cauda')used.cauda=9; // a parte Cauda ocupa a zona
 if(P.parts.cabeca&&P.parts.cabeca.id==='mandibula')used.boca=9; // [etapa-18] a Mandíbula ocupa a boca
 L.lift=!small&&!!(P.parts.corpo&&P.parts.corpo.id==='concha'); // [etapa-18] a concha cobre o dorso: os selos sobem para a camada de cima
 const gone={};for(const m of MUTS)if(m.r==='F'&&P.mut[m.id])for(const s of m.fusion)gone[s]=1; // a fusão substitui as origens
 const c=MUTS.filter(m=>P.mut[m.id]&&MUT_LOOK[m.id]&&!gone[m.id]);
 c.sort((a,b)=>LOOK_RANK[b.r]-LOOK_RANK[a.r]||P.mut[b.id]-P.mut[a.id]||((P.mutAt&&P.mutAt[b.id])||0)-((P.mutAt&&P.mutAt[a.id])||0));
 if(LOOK_DBG.k&&c.length)c.push(...c.splice(0,LOOK_DBG.k%c.length)); // [etapa-18] só no modo de teste

  return `<button class="card mcard r-${m.r} ${P.banMode?'ban':''}" data-id="${m.id}">${(codexSee('m',m.id),'')}<div class="rar">${icon('r'+m.r)} ${RAR[m.r].n}</div><div class="ic">${icH(m.ic)}</div><div class="nm">${m.n}</div><div class="lv">${sub}</div>${m.max>1?`<div class="pips">${pips}</div>`:''}${delta}${m.dash?'<div class="ctag">💨 DASH</div>':''}${needHint(m)}${fusionHint(m)}<div class="k">[${i+1}]</div></button>`;}).join('')
  :`<button class="card mcard r-L" data-id="banquete"><div class="rar">★ TUDO NO MÁXIMO</div><div class="ic">🍖</div><div class="nm">Banquete</div><div class="delta"><span>+${3*Math.min(P.prest||0,30)}%</span> → <b>+${3*Math.min((P.prest||0)+1,30)}%</b> de vida e dano</div><div class="ds">Cura total. Acumula até +90%.</div><div class="k">[1]</div></button>`;
 const tot=P.batchTot||pending,idx=Math.max(1,tot-pending+1);
 show(choiceHTML(`<h2>${P.banMode?'🚫 Banir qual?':'Mutação!'}</h2><div class="sub" style="margin:0">${P.banMode?'A mutação banida não aparece mais nesta partida':(tot>1?`<b>Mutação ${idx} de ${tot}</b> · `:'')+'Nível '+(P.level-pending+1)+' — escolha uma mutação'}</div><div class="cards">${html}</div>
 <div class="tools"><button class="tool" id="rr" ${P.rerolls>0&&!P.banMode?'':'disabled'}>🎲 Sortear de novo (${P.rerolls}) [R]</button><button class="tool ${P.banMode?'on':''}" id="bn" ${P.bans>0&&pick.length?'':'disabled'}>🚫 ${P.banMode?'Cancelar':'Banir'} (${P.bans}) [B]</button></div>`));
 // [etapa-2]
 $('#rr').onclick=rerollCards;
 $('#bn').onclick=toggleBanMode;
 ov.querySelectorAll('.card').forEach(b=>b.onclick=()=>{
  const id=b.dataset.id;
  if(P.banMode&&id!=='banquete'){banMutation(id);return;}
  if(id==='banquete')applyBanquete();else applyMutation(id);
 });
}
function awardPearls(){
 const d=[1,1.5,2.2][run.diff];
 const parts2=[['Criaturas',P.kills*.1],['Elites',P.elites*1],['Chefes',P.bossK*12],['Biomas concluídos',(run.cleared||0)*15],['Tempo',mins()*2]];
 const mb=run.mods?modBonus(run.mods):0; // [etapa-31] bônus dos modificadores (teto de +100%)
 const total=Math.floor(parts2.reduce((a,b)=>a+b[1],0)*d*(1+mb));
 const delta=Math.max(0,total-(run.paid||0));run.paid=total;META.pearls+=delta;saveMeta();
 return `<div class="sub"><span class="pearl" style="font-size:22px">+${delta} ⚪ pérolas</span><br><span style="font-size:13px;opacity:.7">${parts2.filter(p=>p[1]>=1).map(p=>p[0]+' '+Math.floor(p[1])).join(' · ')}${d>1?' · dificuldade x'+d:''}${mb?' · modificadores x'+(1+mb).toFixed(2).replace('.',','):''} · total: ${META.pearls}</span></div>`;
}
function partsIcons(){return Object.keys(SLOTS).map(sl=>P.parts[sl]?icH(PARTS[P.parts[sl].id].ic)+(P.parts[sl].lv>1?'<sup style="font-size:.45em;color:#ffd166">★'+P.parts[sl].lv+'</sup>':''):'<span style="opacity:.4">'+icon(sl)+'</span>').join(' ');} // [etapa-17] encaixe vazio com o ícone próprio (o emoji 🛡️/🦵/👁️ repetia itens)
function statsHTML(){return `<div class="stats"><span>Modo</span><span>${run.mode==='camp'?'Campanha':'Infinito'} · ${DIFFS[run.diff].ic} ${DIFFS[run.diff].name}</span><span>Mutante</span><span>${mutantName()}${P.asc?' ★'+P.asc:''}</span><span>Partes</span><span>${partsIcons()}</span><span>Bioma</span><span>${BIOMES[run.biome].ic} ${BIOMES[run.biome].name}</span><span>Nível</span><span>${P.level}</span><span>Tempo</span><span>${fmt(time)}</span><span>Criaturas derrotadas</span><span>${P.kills} (${P.elites} elites)</span><span>Chefes derrotados</span><span>${P.bossK}</span><span>Engolidas inteiras</span><span>${P.eaten}</span><span>Sessão</span><span>${sessionMin()} min</span></div>`;} // [etapa-10]
function gameOver(){
 if(state!=='play')return;
 finishTutorial(); // [etapa-11]
 setState('over');snd(200,.8,'sawtooth',.06,-160,'uiRaw');
 let rec='';
 if(run.daily){if(time>dailyBest()){DAILY.d=todaySeed();DAILY.best=time;store.set('carc_daily',JSON.stringify(DAILY));rec='<div class="sub" style="color:#ffd166">🎯 Novo recorde do desafio de hoje!</div>';}} // [etapa-31] recorde próprio (não mexe no do Infinito)
 else if(run.mode==='inf'&&!Object.keys(run.mods||{}).length){const k='carc2_inf_'+run.diff,prev=+(store.get(k)||0);if(time>prev){store.set(k,String(time));rec='<div class="sub" style="color:#ffd166">🏆 Novo recorde no Infinito!</div>';}}
 const pr=awardPearls();
 // [etapa-1] S7 a tela atrasada só abre se ainda for este mesmo game over
 const runRef=run;
 setTimeout(()=>{if(state!=='over'||run!==runRef)return;// [etapa-10] tom encorajador; mostra o que melhorou; três botões com o mesmo peso visual; sem contagem regressiva nem auto-início
 show(`<h2>A evolução continua</h2><div class="sub">Você foi devorado desta vez — mas seu DNA aprendeu algo.</div>${deathCauseHTML()}${rec}${pr}${nearAchHTML()}${breakBoxHTML()}${statsHTML()}<br>
 <div class="row"><button class="btn alt" id="again" data-autofocus>Jogar de novo</button><button class="btn alt" id="lb">🧪 Laboratório</button><button class="btn alt" id="mn">Menu</button></div>`);
 $('#again').onclick=()=>startRun(run.mode,run.diff,{daily:run.daily});$('#mn').onclick=menu;$('#lb').onclick=lab;wireBreakBox();},700); // [etapa-2/10]
}
function win(){
 setState('win');finishTutorial();/* [etapa-11] */store.set('carc2_won','1');
 run.winT=-1; // [etapa-1] S7 winT exatamente 0 travava as cartas após "Continuar no Infinito"
 ach('carcinizacao');if(run.diff>=1)ach('dificil');if(run.diff>=2)ach('abissal');

 snd(523,.2,'triangle',.06,0,'ui');setTimeout(()=>snd(659,.2,'triangle',.06,0,'ui'),180);setTimeout(()=>snd(784,.4,'triangle',.06,0,'ui'),360);

 show(`<h1 style="font-size:clamp(36px,7vw,70px)">CARCINIZAÇÃO<br>COMPLETA</h1><div class="evo">${STAGES[P.stage].ic}</div>${mapHTML(5,-1)}<div class="sub">Você atravessou os 5 biomas e derrotou o Caranguejo Ancestral.${nr?'<br><b style="color:#ffd166">🏆 Novo recorde!</b>':''}</div>
 ${pr}${nearAchHTML()}${breakBoxHTML()}${statsHTML()}<br>
 <div class="row"><button class="btn purple" id="inf" data-autofocus>♾️ Continuar no Infinito</button><button class="btn" id="again">Jogar de novo</button><button class="btn alt" id="mn">Menu</button></div>
 <div class="small">No Infinito, você mantém tudo o que conquistou e a dificuldade continua subindo até o fim.</div>`);
 // [etapa-2]
 $('#inf').onclick=continueInfinite;wireBreakBox(); // [etapa-10]
 $('#again').onclick=()=>startRun(run.mode,run.diff,{daily:run.daily});$('#mn').onclick=menu;
}


/* ================= Loop ================= */
let last=performance.now();
// [etapa-1] B2 qualidade adaptativa: mede o tempo de TRABALHO do quadro (update+render), não o intervalo do rAF,
// com histerese em segundos e espera crescente para subir de novo (evita oscilar).
let quality='auto'; // 'auto' | 'alta' | 'baixa' — será exposto nas Opções (Prompt 3)
const QA={ema:8,over:0,under:0,upWait:5};
function setLowQ(v){if(lowQ===v)return;lowQ=v;if(P)P.looksDirty=true;/* [etapa-17] */_gc.clear();resize();} // resize() só realoca o canvas se o tamanho/DPR mudar
function setQuality(q){quality=q==='alta'||q==='baixa'?q:'auto';QA.over=QA.under=0;if(quality==='alta')setLowQ(false);else if(quality==='baixa')setLowQ(true);}
function adaptQuality(work,el){
 if(quality!=='auto'){return;}
 QA.ema+=(work-QA.ema)*Math.min(1,el*4); // ~0,25 s de suavização
 if(!lowQ){if(QA.ema>20){QA.over+=el;if(QA.over>2){setLowQ(true);QA.over=0;QA.under=0;}}else QA.over=0;}
 else{if(QA.ema<12){QA.under+=el;if(QA.under>QA.upWait){setLowQ(false);QA.under=0;QA.over=0;QA.upWait=Math.min(60,QA.upWait*2);}}else QA.under=0;}
}
function loop(now){
 const raw=now-last,dt=clamp(raw/1000,0,.033);last=now; // [etapa-1] S7 dt nunca negativo
 const t0=performance.now();
 frameNo++;if(hsCool>0)hsCool-=dt; // [etapa-4]
 pollPad(dt); // [etapa-6]
 if(state==='play'){if(hitstop>0)hitstop-=dt;else if(PERF.on){const tu=performance.now();update(dt);PERF.upd=PERF.upd*.9+(performance.now()-tu)*.1;}else update(dt);} // [etapa-12]
 if(PERF.on&&raw>0)PERF.fps=PERF.fps*.9+1000/raw*.1;
 else if(state==='menu'||(state==='settings'&&settingsFrom==='menu'))time+=dt; // [etapa-3]
 if(toasts.length){toasts[0].t-=dt;if(toasts[0].t<=0)toasts.shift();}
 updateAmbient(dt); // [etapa-1] A4
 updateTips(dt); // [etapa-11]
 render();perfPanel(); // [etapa-12]
 if(state==='play'&&raw>0&&raw<200)adaptQuality(performance.now()-t0,raw/1000); // [etapa-1] B2/S7 ignora intervalos <= 0
 requestAnimationFrame(loop);
}
applySettings(); // [etapa-2/3] qualidade, reduzir movimento e ataque automático vêm das configurações
newGame('camp',0);menu();
requestAnimationFrame(loop);
})();
</script>
